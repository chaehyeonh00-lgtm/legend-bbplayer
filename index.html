<style>

<div class="wrap">

      <div class="tag">고교 벤치 멤버에서 KBO·MLB를 거쳐 명예의 전당까지 — 야구 커리어 시뮬레이션</div>

<script>
/* ================= 유틸 ================= */
const R=Math.random;
const rnd=(a,b)=>a+R()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(R()*a.length)];
function pickN(a,n){const c=a.slice();const o=[];while(o.length<n&&c.length)o.push(c.splice(Math.floor(R()*c.length),1)[0]);return o;}
function randn(){let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f3=v=>v.toFixed(3).replace(/^0/,'');
const f2=v=>v.toFixed(2);
const ipFmt=ip=>{const w=Math.floor(ip);const o=Math.round((ip-w)*3);return o===3?(w+1)+'.0':w+'.'+o;};

/* ================= 데이터 ================= */
const BAT=['con','pow','eye','spd','def','arm'];
const PIT=['vel','ctl','brk','stf','sta','men'];
const SN={con:'컨택',pow:'파워',eye:'선구안',spd:'주루',def:'수비',arm:'송구',vel:'구속',ctl:'제구',brk:'변화구',stf:'구위',sta:'체력',men:'멘탈'};
const PHYS={spd:1,arm:1,def:1,vel:1,sta:1,stf:1};
const POS={
  SP:{n:'선발투수',p:1,w:{vel:1.2,ctl:1.3,brk:1.2,stf:1.1,sta:1.2,men:.8}},
  RP:{n:'불펜투수',p:1,w:{vel:1.5,ctl:1.1,brk:1.1,stf:1.3,sta:.4,men:1.1}},
  C:{n:'포수',w:{con:1,pow:1,eye:1,spd:.3,def:1.6,arm:1.3},adj:1.0},
  '1B':{n:'1루수',w:{con:1.3,pow:1.6,eye:1.2,spd:.3,def:.6,arm:.3},adj:-.8},
  '2B':{n:'2루수',w:{con:1.1,pow:.7,eye:.9,spd:1,def:1.3,arm:.8},adj:.4},
  '3B':{n:'3루수',w:{con:1,pow:1.2,eye:.9,spd:.5,def:1.1,arm:1.2},adj:.2},
  SS:{n:'유격수',w:{con:1,pow:.6,eye:.8,spd:1,def:1.6,arm:1.1},adj:1.0},
  LF:{n:'좌익수',w:{con:1.2,pow:1.4,eye:1,spd:.8,def:.7,arm:.6},adj:-.4},
  CF:{n:'중견수',w:{con:1.1,pow:.8,eye:.9,spd:1.4,def:1.4,arm:.8},adj:.6},
  RF:{n:'우익수',w:{con:1.2,pow:1.4,eye:1,spd:.8,def:.7,arm:1},adj:-.3},
  DH:{n:'지명타자',w:{con:1.5,pow:1.8,eye:1.4,spd:.3,def:0,arm:0},adj:-1.4}
};
const LG={
  HS:{n:'고교야구',s:'고교',L:48,G:30},
  UNIV:{n:'대학야구',s:'대학',L:53,G:40},
  INDIE:{n:'독립리그',s:'독립',L:50,G:60},
  KBO:{n:'KBO 리그',s:'KBO',L:65,G:144,farm:'FUT',top:1,ps:'한국시리즈'},
  FUT:{n:'퓨처스리그',s:'퓨처스',L:52,G:110},
  NPB:{n:'NPB',s:'NPB',L:69,G:143,farm:'NPB2',top:1,ps:'일본시리즈'},
  NPB2:{n:'NPB 2군',s:'NPB 2군',L:56,G:110},
  MLB:{n:'MLB',s:'MLB',L:77,G:162,farm:'AAA',top:1,ps:'월드시리즈'},
  AAA:{n:'마이너리그 AAA',s:'AAA',L:64,G:140},
  MIL:{n:'상무 (퓨처스)',s:'상무',L:52,G:100},
  ARMY:{n:'현역 복무',s:'현역',L:0,G:0}
};
const T={
  KBO:['LG 트윈스','KIA 타이거즈','삼성 라이온즈','두산 베어스','KT 위즈','SSG 랜더스','롯데 자이언츠','한화 이글스','NC 다이노스','키움 히어로즈'],
  NPB:['요미우리 자이언츠','한신 타이거스','소프트뱅크 호크스','오릭스 버펄로스','요코하마 DeNA','주니치 드래건스','히로시마 카프','라쿠텐 골든이글스','세이부 라이온스','니혼햄 파이터스','지바 롯데 마린스','야쿠르트 스왈로스'],
  MLB:['LA 다저스','뉴욕 양키스','샌디에이고 파드리스','샌프란시스코 자이언츠','보스턴 레드삭스','시카고 컵스','애틀랜타 브레이브스','필라델피아 필리스','휴스턴 애스트로스','텍사스 레인저스','시애틀 매리너스','토론토 블루제이스','뉴욕 메츠','탬파베이 레이스','피츠버그 파이리츠','디트로이트 타이거스','볼티모어 오리올스','클리블랜드 가디언스','밀워키 브루어스','애리조나 다이아몬드백스','미네소타 트윈스','캔자스시티 로열스','신시내티 레즈','세인트루이스 카디널스','애슬레틱스','LA 에인절스','콜로라도 로키스','마이애미 말린스','워싱턴 내셔널스','시카고 화이트삭스'],
  HS:['덕수고','서울고','휘문고','장충고','충암고','유신고','북일고','경북고','대구상원고','광주제일고','부산고','마산용마고','인천고','강릉고'],
  UNIV:['연세대','고려대','성균관대','동국대','한양대','경희대','단국대','인하대'],
  INDIE:['연천 미라클','파주 챌린저스','성남 맥파이스','가평 웨일스']
};
const HS_TOURN=['황금사자기','청룡기','대통령배','봉황대기'];
const SAVE_KEY='b2h_save_v1', RANK_KEY='b2h_rank_v1';

/* ================= 상태 ================= */
let S=null, UI={tab:'news'};
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const t=localStorage.getItem(SAVE_KEY);return t?JSON.parse(t):null;}catch(e){return null;}}
function keys(){return POS[S.pos].p?PIT:BAT;}
function ovrOf(st,pos){const w=POS[pos].w;let a=0,b=0;for(const k in w){a+=w[k]*st[k];b+=w[k];}return Math.round(a/b);}
function ovr(){return ovrOf(S.stats,S.pos);}
function news(t){S.news.unshift({y:S.year,t});if(S.news.length>250)S.news.length=250;}
function isPro(){return ['KBO','NPB','MLB'].includes(S.lg);}
function topLg(l){return LG[l]&&LG[l].top;}

/* ================= 후보 생성 ================= */
function makeCandidate(pos,body){
  const w=POS[pos].w, ks=POS[pos].p?PIT:BAT;
  const mw=ks.reduce((a,k)=>a+w[k],0)/6;
  const st={};
  ks.forEach(k=>{
    let v=45+(w[k]-mw)*11+randn()*5;
    if(body==='slim'){ if(k==='spd'||k==='ctl'||k==='def')v+=4; if(k==='pow'||k==='vel'||k==='stf')v-=4;}
    if(body==='power'){ if(k==='pow'||k==='vel'||k==='stf')v+=5; if(k==='spd'||k==='ctl')v-=4;}
    st[k]=v;
  });
  // 합계 270 정규화
  let sum=ks.reduce((a,k)=>a+st[k],0);
  ks.forEach(k=>st[k]=clamp(Math.round(st[k]*270/sum),28,64));
  sum=ks.reduce((a,k)=>a+st[k],0);
  let i=0;while(sum!==270&&i<300){const k=ks[i%6];if(sum<270&&st[k]<64){st[k]++;sum++;}else if(sum>270&&st[k]>28){st[k]--;sum--;}i++;}
  // 종합 45로 맞추기 (가중치 높은 능력치 ↔ 낮은 능력치 이동)
  const sorted=ks.slice().sort((a,b)=>w[b]-w[a]);
  let g=0;
  while(ovrOf(st,pos)!==45&&g<300){
    const o=ovrOf(st,pos);
    const hi=sorted[g%2], lo=sorted[5-(g%2)];
    if(o<45&&st[lo]>28&&st[hi]<64){st[lo]--;st[hi]++;}
    else if(o>45&&st[hi]>28&&st[lo]<64){st[hi]--;st[lo]++;}
    g++;
  }
  const pot=Math.round(50+40*Math.pow(R(),2.5)+(R()<.03?5:0));
  const tr=R();
  return {stats:st,pot,trait:tr<.2?'early':tr<.32?'late':'normal',aging:rnd(.75,1.3),injury:rnd(.7,1.3),potGuess:clamp(pot+rint(-10,10),50,99)};
}

/* ================= 역할 / 리그 ================= */
function roleFor(o,lg,team){
  const L=LG[lg].L+(S.teamOff[team]||0);const d=o-L;
  if(d>=4)return '핵심';if(d>=-1)return '주전';if(d>=-5)return '로테이션';if(d>=-9)return '백업';
  return LG[lg].farm?'2군':'벤치';
}
function roleLabel(r,pos){
  pos=pos||S.pos;
  if(pos==='SP')return {핵심:'에이스',주전:'선발 로테이션',로테이션:'5선발·스윙맨',백업:'추격조',벤치:'벤치',['2군']:'2군'}[r]||r;
  if(pos==='RP')return {핵심:'마무리',주전:'필승조',로테이션:'불펜',백업:'추격조',벤치:'벤치',['2군']:'2군'}[r]||r;
  return {핵심:'핵심 주전',주전:'주전',로테이션:'플래툰',백업:'백업',벤치:'벤치',['2군']:'2군'}[r]||r;
}
const PT={핵심:1,주전:.95,로테이션:.55,백업:.25,벤치:.13};
function tourneyOf(y){if(y===2028)return '올림픽';if(y>=2030&&(y-2030)%4===0)return '아시안게임';if((y-2029)%4===0)return 'WBC';if((y-2027)%4===0)return '프리미어12';return null;}

function kboSal(o){return clamp(.075*Math.pow(Math.max(0,o-50),1.8)+S.fame*.04,.5,30);}
function npbSal(o){return clamp(.1*Math.pow(Math.max(0,o-52),1.8),1,55);}
function mlbSal(o){return clamp(.14*Math.pow(Math.max(0,o-66),2),.8,50);}
function salFmt(c){if(!c)return '-';if(c.cur==='USD')return '$'+c.sal.toFixed(2)+'M';return c.sal.toFixed(c.sal<10?1:0)+'억원';}
function conYears(age,o,lg){let y=age<=29?4:age<=32?3:age<=35?2:1;if(lg==='MLB'&&o>=LG.MLB.L+8&&age<=30)y+=2;return y;}

/* ================= 시즌 시뮬 ================= */
function simBat(lg,pt,avail){
  const L=LG[lg].L,G=LG[lg].G,s=S.stats,o=ovr(),rel=o-L;
  const PA=Math.max(0,Math.round(G*4.25*pt*avail*rnd(.93,1.05)));
  const games=Math.min(G,Math.round(G*Math.min(1,pt*1.08)*avail));
  if(PA<5)return {G:games,PA,AB:PA,H:0,HR:0,RBI:0,SB:0,avg:0,obp:0,slg:0,ops:0,war:0};
  const nz=Math.sqrt(400/Math.max(PA,40));
  const avg=clamp(.262+(s.con-L)*.0032+rel*.0012+randn()*.017*nz,.12,.405);
  const bbr=clamp(.085+(s.eye-L)*.0022+randn()*.01,.03,.2);
  const BB=Math.round(PA*bbr), AB=Math.max(1,PA-BB-Math.round(PA*.012));
  const H=Math.round(AB*avg);
  const HR=Math.max(0,Math.round(AB*Math.max(.004,.03+(s.pow-L)*.0021+randn()*.004)));
  const D2=Math.round((H-HR)*rnd(.17,.23)), D3=Math.max(0,Math.round((H-HR)*Math.max(0,(s.spd-L)*.0015+.008)));
  const slg=(H+D2+2*D3+3*HR)/AB, obp=(H+BB)/PA;
  const SB=Math.max(0,Math.round(((s.spd-L)+5)*.9*PA/600+randn()*3));
  const RBI=Math.max(0,Math.round(HR*2.4+(H-HR)*.32+randn()*5));
  const ops=obp+slg, p=POS[S.pos];
  const defB=p.w.def>0?(s.def-L)*.035+(s.arm-L)*.01:0;
  const war=PA/650*((ops-.735)*21+1.5+defB+(p.adj||0));
  return {G:games,PA,AB,H,HR,RBI,SB,avg:H/AB,obp,slg,ops,war:+war.toFixed(1)};
}
function simPit(lg,role,pt,avail){
  const L=LG[lg].L,G=LG[lg].G,s=S.stats,o=ovr(),rel=o-L,sp=S.pos==='SP';
  let GS=0,RG=0;
  if(sp){
    if(role==='핵심'||role==='주전')GS=G/5.2;
    else if(role==='로테이션'){GS=G/5.2*.45;RG=15;}
    else if(role==='백업'){GS=rint(0,3);RG=30;}
    else {GS=G/5.2*.3;RG=4;}
  }else{
    RG=G*({핵심:.42,주전:.45,로테이션:.3,백업:.15,벤치:.12}[role]||.2);
  }
  GS=Math.round(GS*avail);RG=Math.round(RG*avail);
  const ipS=clamp(5.4+rel*.06+(s.sta-L)*.03,4.3,7.4);
  const IP=GS*ipS+RG*rnd(.95,1.15);
  if(IP<1)return {G:GS+RG,GS,IP:0,W:0,L:0,SV:0,HLD:0,K:0,era:0,war:0};
  const nz=Math.sqrt(100/Math.max(IP,15));
  const era=clamp(4.3-rel*.11-(s.ctl-L)*.015+randn()*.42*nz,.8,9.5);
  const k9=clamp(7.4+(s.vel-L)*.07+(s.brk-L)*.05+(s.stf-L)*.03,3.5,15.5);
  const K=Math.round(IP*k9/9);
  const to=S.teamOff[S.team]||0;
  let W=Math.max(0,Math.round(GS*(.31+(4.3-era)*.045+to*.012)+RG*rnd(.02,.06)));
  let Lo=Math.max(0,Math.round(GS*clamp(.3-(4.3-era)*.035,.08,.5)+RG*rnd(.02,.05)));
  let SV=0,HLD=0;
  if(!sp&&role==='핵심')SV=Math.round(RG*clamp(.55+(3.5-era)*.06,.3,.75));
  if(!sp&&role==='주전')HLD=Math.round(RG*rnd(.28,.4));
  const war=(5.2-era)*IP/9/11.5+(SV>20?.5:0);
  return {G:GS+RG,GS,IP,W,L:Lo,SV,HLD,K,era,war:+war.toFixed(1)};
}
function lineText(r){
  const l=r.line;if(!l)return r.role==='복무'?'현역 복무 (공식 경기 없음)':'-';
  if(POS[S.pos].p){
    if(!l.IP)return '등판 없음';
    const sv=l.SV?` ${l.SV}세이브`:'',h=l.HLD?` ${l.HLD}홀드`:'';
    return `${l.W}승 ${l.L}패${sv}${h} · ERA ${f2(l.era)} · ${ipFmt(l.IP)}이닝 · ${l.K}K`;
  }
  if(l.PA<5)return `${l.G}경기 ${l.PA}타석`;
  return `타율 ${f3(l.avg)} · ${l.HR}홈런 · ${l.RBI}타점 · ${l.SB}도루 · OPS ${f3(l.ops)}`;
}

function award(rec,name){rec.awards.push(name);S.awards.push({y:rec.year,n:name});}

function checkAwards(rec,lg){
  const l=rec.line,p=POS[S.pos].p,sp=S.pos==='SP',war=l.war,s=LG[lg].s;
  const qualB=!p&&l.PA>=400, qualSP=sp&&l.IP>=130, qualRP=!sp&&p&&l.IP>=45;
  const qualRook=p?(sp?l.IP>=70:l.IP>=40):l.PA>=250;
  if(!S.rookie[lg]&&qualRook){S.rookie[lg]=1;if(war>rnd(1.5,3.4))award(rec,`${s} 신인왕`);}
  if(war>rnd(6.3,8.6))award(rec,`${s} MVP`);
  if(!p){
    if(qualB&&war>rnd(3,5))award(rec,lg==='KBO'?'골든글러브':lg==='NPB'?'NPB 베스트나인':'실버슬러거');
    if(lg==='MLB'&&qualB&&S.stats.def-LG[lg].L>rnd(8,15)&&POS[S.pos].w.def>0)award(rec,'골드글러브');
    const hrK={KBO:[33,45],NPB:[30,42],MLB:[40,55]}[lg];
    if(l.HR>rnd(...hrK))award(rec,`${s} 홈런왕`);
    if(l.PA>=446&&l.avg>rnd(.335,.365))award(rec,`${s} 타격왕`);
    if(l.SB>rnd(35,55))award(rec,`${s} 도루왕`);
    if(l.RBI>rnd(110,135))award(rec,`${s} 타점왕`);
  }else{
    if(sp&&qualSP&&war>rnd(5.3,7.6))award(rec,{KBO:'최동원상',NPB:'사와무라상',MLB:'사이영상'}[lg]);
    if(lg==='KBO'&&(qualSP||qualRP)&&war>rnd(4.6,6.6))award(rec,'골든글러브');
    if(l.W>rnd(15,19))award(rec,`${s} 다승왕`);
    if(qualSP&&l.era<rnd(2.15,2.8))award(rec,`${s} 평균자책점왕`);
    if(l.K>rnd(190,240))award(rec,`${s} 탈삼진왕`);
    if(l.SV>rnd(32,42))award(rec,`${s} 세이브왕`);
  }
  if(lg!=='NPB'&&war>rnd(2.6,3.8))award(rec,`${s} 올스타`);
}

function playSeason(){
  const ov0=ovr(),yr=S.year,age=S.age;
  const rec={year:yr,age,team:S.team,lg:S.lg,playLg:S.lg,ovr:ov0,awards:[],notes:[],role:'',line:null};
  let pf=0,majorInj=false,war=0;

  }else{
    let role,playLg=S.lg,pt;
    if(S.lg==='MIL'){role=ov0>=LG.MIL.L-3?'주전':'로테이션';pt=PT[role];}
    else{
      role=roleFor(ov0,S.lg,S.team);pt=PT[role];
      if(role==='2군'){playLg=LG[S.lg].farm;const d=ov0-LG[playLg].L;pt=d>=-3?.9:d>=-8?.5:.25;}
    }
    // 부상
    let avail=1;
    let inj=(.1+(S.body==='power'?.03:0)+(age>=32?.03:0))*S.injuryK*(S.training==='rest'?.5:1);
    if(R()<inj){
      if(R()<.15){majorInj=true;avail=rnd(0,.4);const ks=keys().filter(k=>PHYS[k]);ks.forEach(k=>S.stats[k]=Math.max(20,S.stats[k]-rnd(1.5,4)));rec.notes.push('장기 부상 (시즌 대부분 결장, 능력치 영구 하락)');news(`💥 ${S.name}, 큰 부상으로 장기 재활. 복귀 후에도 후유증 우려.`);}
      else{avail=rnd(.6,.85);rec.notes.push('부상으로 일부 결장');}
    }
    if(S.returnHalf){avail*=.5;rec.notes.push('시즌 중반 전역 후 합류');S.returnHalf=false;}
    const sideRole=playLg!==S.lg&&S.lg!=='MIL'?(pt>=.9?'주전':pt>=.5?'로테이션':'백업'):role;
    rec.line=POS[S.pos].p?simPit(playLg,sideRole,pt,avail):simBat(playLg,pt,avail);
    rec.role=role;rec.playLg=playLg;war=rec.line.war;
    pf={핵심:1,주전:1,로테이션:.85,백업:.6,벤치:.55,'2군':pt>=.9?.8:.65}[role];
    if(S.lg==='MIL')pf=.85;
    if(avail<.5)pf*=.6;
    // 수상
    if(topLg(playLg)&&playLg===S.lg)checkAwards(rec,playLg);
    // 팀 성적
    const to=S.teamOff[S.team]||0;
    const sc=to+war*.25+randn()*2.2;
    if(topLg(S.lg)&&playLg===S.lg){
      if(sc>5){award(rec,`${LG[S.lg].ps} 우승`);rec.team_r='우승';}
      else if(sc>2)rec.team_r='포스트시즌';else rec.team_r='탈락';
    }else if(topLg(S.lg)){rec.team_r='2군';
    }else if(S.lg==='HS'){
      if(sc>3.2&&rec.role!=='벤치'){award(rec,`${pick(HS_TOURN)} 우승`);}
      if(age>=17&&ov0>=52&&!S.awards.some(a=>a.n==='U-18 청소년 대표')){award(rec,'U-18 청소년 대표');}
    }else if(S.lg==='UNIV'&&sc>3.5){award(rec,'대학야구 U-리그 우승');}
  }
  // 국가대표
  if(S.natYear===yr&&S.lg!=='ARMY'){
    const t=tourneyOf(yr),c=(ov0-66)*.012;S.caps++;
    let res;
    if(t==='아시안게임'){res=R()<.66+c?'금메달':R()<.6?'은메달':'동메달';}
    else if(t==='올림픽'){const x=R();res=x<.18+c?'금메달':x<.4+c?'은메달':x<.62+c?'동메달':'노메달';}
    else if(t==='WBC'){const x=R();res=x<.07+c?'우승':x<.17+c?'준우승':x<.4?'8강':'1라운드 탈락';}
    else {const x=R();res=x<.25+c?'우승':x<.5?'준우승':'슈퍼라운드';}
    rec.notes.push(`${t} 국가대표: ${res}`);
    if(['금메달','우승'].includes(res))award(rec,`${t} ${res}`);
    else if(res.includes('메달')&&res!=='노메달')award(rec,`${t} ${res}`);
    news(`🇰🇷 ${t} 대표팀 결과: ${res}`);
    if(S.mil==='none'&&((t==='아시안게임'&&res==='금메달')||(t==='올림픽'&&res!=='노메달'))){S.mil='exempt';news(`🎖️ ${t} ${res}로 병역 특례(예술체육요원) 대상이 됐다!`);rec.notes.push('병역 특례 획득');}
  }
  // 명성
  const big=rec.awards.filter(a=>/MVP|사이영|최동원|사와무라/.test(a)).length;
  S.fame=clamp(S.fame*.95+(topLg(rec.playLg)?Math.max(0,war)*1.4:Math.max(0,war)*.4)+rec.awards.length*2.5+big*8,0,100);
  // 성장
  growth(age,pf,war,majorInj);
  // 계약/서비스
  if(S.lg==='KBO')S.svc.kbo++;
  if(S.lg==='MLB'&&rec.playLg==='MLB')S.svc.mlb++;
  if(S.lg==='NPB')S.svc.npb++;
  if(S.con&&S.con.type==='fa')S.con.years--;
  if(['HS','UNIV','INDIE'].includes(S.lg))S.amYears++;
  if(S.lg==='UNIV')S.uniYears++;
  rec.after=ovr();S.peak=Math.max(S.peak,rec.after);
  S.seasons.push(rec);
  // 뉴스
  const lgName=LG[rec.playLg].s;
  news(`${yr} 시즌 종료 — ${S.team} (${lgName}) · ${roleLabel(rec.role)} · ${lineText(rec)} · WAR ${rec.line?rec.line.war:0}`);
  rec.awards.forEach(a=>news(`🏆 ${a}`));
  // 전역 처리
  let discharged=false;
  if(S.lg==='MIL'||S.lg==='ARMY'){
    S.mil='done';discharged=true;const mi=S.milInfo;
    if(mi&&mi.team){S.team=mi.team;S.lg='KBO';S.con=mi.con;S.returnHalf=true;news(`🪖 전역. 원소속팀 ${S.team}에 복귀한다.`);}
    else{S.lg='KBO';S.team='(무소속)';S.con={type:'fa',years:0,sal:0,cur:'KRW'};S.returnHalf=true;S.needFA='return';news('🪖 전역. 새 소속팀을 찾아야 한다.');}
    S.milInfo=null;
  }
  S.year++;S.age++;S.lastRec=rec;
  genOffseason();
  save();
  showSeasonModal(rec,ov0);
}

function growth(age,pf,war,majorInj){
  let g;
  if(age<=18)g=3.8;else if(age<=21)g=3.2;else if(age<=24)g=2.5;else if(age<=26)g=1.5;else if(age<=28)g=.6;else if(age<=30)g=-.2;
  else g=-(.9+(age-31)*.55+Math.max(0,age-34)*.45)*S.aging*rnd(.6,1.4)-(R()<.1?rnd(2,4):0);
  const o=ovr();
  if(S.lg==='ARMY'){g=-1.1;}
  else if(g>0){
    const gap=S.pot-o;const potF=gap<=0?0:S.lg==='HS'?clamp(gap/12,.3,1):clamp(gap/10,.12,1.15);
    let tf=1;
    if(S.trait==='early')tf=age<22?1.3:age>=25?.7:1;
    if(S.trait==='late')tf=age<24?.8:1.1;
    g=g*pf*potF*tf*rnd(.55,1.3);
    if(S.lg!=='HS')g+=clamp(war*.08,-.3,.5)*potF;
    g=Math.min(g,Math.max(0,S.pot-o+.5));
    if(S.training==='rest')g*=.85;
    if(majorInj)g*=.5;
  }else{
    if(S.training==='rest')g*=.8;
  }
  // 대기만성
  if(S.trait==='late'&&age>=26&&age<=28&&!S.bloomed&&pf>=.85){S.bloomed=true;S.pot+=rint(6,10);g+=1.5;news(`🌱 ${S.name}, 뒤늦게 눈을 떴다! 코치진 "지금부터가 진짜"`);}
  distribute(g);
}
function distribute(g){
  const ks=keys(),w=POS[S.pos].w,mw=ks.reduce((a,k)=>a+w[k],0)/6,sw=ks.reduce((a,k)=>a+w[k],0);
  const r={};
  ks.forEach(k=>{
    if(g>=0)r[k]=(w[k]/mw)*.7+.3+(S.training===k?1.3:0)+(S.training==='bal'?.1:0);
    else r[k]=PHYS[k]?1.6:(k==='men'||k==='eye')?.2:.6;
    r[k]*=rnd(.7,1.3);
  });
  const c=sw/ks.reduce((a,k)=>a+w[k]*r[k],0);
  ks.forEach(k=>{S.stats[k]=clamp(S.stats[k]+g*c*r[k],15,99);});
}

/* ================= 오프시즌 이벤트 ================= */
function genOffseason(){
  const q=S.queue;const o=ovr(),age=S.age;
  // 은퇴 강제

        if(Math.abs(ns-c.sal)>=.05){news(`연봉 협상: ${salFmt(c)} → ${ns.toFixed(1)}억원`);c.sal=+ns.toFixed(1);}
        if(S.svc.kbo>=7&&o>=72&&S.postYear!==S.year)q.push(evPosting());
        if(lr&&lr.role==='2군'&&age>=29&&o<LG.FUT.L+3&&!faNow){faNow=true;news(`✂️ ${S.team}, ${S.name} 방출.`);q.push(evFA('release'));}
      }
    }else if(c.type==='reserve'&&S.lg==='MLB'){
      const lr=S.lastRec;
      if(S.svc.mlb>=6){faNow=true;q.push(evFA('FA'));}
      else if(lr&&lr.role==='2군'&&age>=26&&o<LG.AAA.L+2){faNow=true;news(`✂️ ${S.team}, ${S.name} 방출.`);q.push(evFA('release'));}
      else{const ns=lr&&lr.playLg==='MLB'?(S.svc.mlb>=3?Math.max(.78,mlbSal(o)*.45):.78):.12;c.sal=+ns.toFixed(2);}
    }else if(c.type==='fa'&&c.years<=0){faNow=true;q.push(evFA('FA'));}
    else if(c.type==='fa'&&S.lastRec&&S.lastRec.role==='2군'&&age>=33&&R()<.5){faNow=true;news(`✂️ ${S.team}, 잔여 계약을 정리하고 ${S.name} 방출.`);q.push(evFA('release'));}
  }
  // 트레이드 제안
  if(pro&&!faNow&&S.lastRec&&['백업','2군'].includes(S.lastRec.role)&&o>=LG[S.lg].L-10&&R()<.35){
    const ev=evTrade('구단 간 트레이드 제안이 들어왔다.');if(ev)q.push(ev);
  }

    if(ok)q.push({k:'NAT',title:`${t} 국가대표 소집`,desc:`${S.year}년 ${t}에 나설 대표팀 명단에 이름이 올랐다.${(t==='아시안게임'||t==='올림픽')&&S.mil==='none'?'\n※ 아시안게임 금메달·올림픽 메달 시 병역 특례.':''}`,choices:[{label:'소집에 응한다',sub:'태극마크를 단다',act:'natYes',data:{y:S.year}},{label:'정중히 거절한다',sub:'소속팀에 집중 (명성 소폭 하락)',act:'natNo'}]});
  }
  // 코치 제안
  if(age>=19&&age<=31&&S.coachN<2&&S.lg!=='ARMY'&&R()<.2)q.push({k:'COACH',title:'육성 방향 전환점',desc:'코치가 면담을 요청했다.\n"앞으로 집중해서 키우고 싶은 능력 두 가지를 골라 봐. 확실히 끌어올려 줄게."',coach:1});
  // 기자회견
  if(pro&&S.year-S.lastPress>=3&&S.fame>=12&&R()<.6)q.push(evPress());
  // 주장
  if(topLg(S.lg)&&age>=28&&S.fame>=30&&S.year-S.teamSince>=4&&!S.captainOf.includes(S.team)&&R()<.3)
    q.push({k:'CAP',title:'주장 제안',desc:`${S.team} 감독이 다음 시즌 주장을 맡아 달라고 한다.`,choices:[{label:'주장 완장을 찬다',sub:'명성 +, 멘탈 +',act:'captain'},{label:'사양한다',sub:'플레이에만 집중',act:'stay'}]});
}
function evDraft(){

  if(!tier&&sc>=44&&R()<.7){const t=pick(T.KBO);ch.push({label:`${t} 육성선수 계약`,sub:'지명은 못 받았지만 테스트 끝에 입단 (2군에서 시작)',act:'draftKBO',data:{team:t,b:0,dev:1}});}
  if(from==='HS'){const u=pick(T.UNIV);ch.push({label:`${u} 진학`,sub:'대학에서 4년 더 다듬고 다시 드래프트 도전',act:'college',data:{team:u}});}

  return {k:'DRAFT',title,desc,choices:ch};
}
function evMil(forced){

function evPosting(){return {k:'POST',title:'해외 진출 기회',desc:`KBO ${S.svc.kbo}시즌을 채워 포스팅 자격을 얻었다. 구단의 허락이 있으면 메이저리그·일본 구단과 협상할 수 있다.`,choices:[{label:'포스팅을 요청한다',sub:'구단 승인 필요',act:'posting'},{label:'팀에 남는다',sub:'FA까지 기다린다',act:'stay'}]};}
function mkOffer(team,lg,yrs,tag,minor){
  const o=ovr();let sal,cur='KRW';

  sal=+sal.toFixed(cur==='USD'?2:1);
  const c={type:'fa',years:minor?1:yrs,sal,cur};
  const role=roleLabel(roleFor(o,lg,team));
  return {label:`${tag?tag+' · ':''}${team}`,sub:`${LG[lg].s} · ${c.years}년 · 연 ${salFmt(c)}${cur==='USD'?` (약 ${Math.round(sal*14)}억원)`:''}${minor?' · 스플릿 계약':''} · 예상 역할: ${role}`,act:'sign',data:{team,lg,con:c}};
}
function buildOffers(kind,opt={}){
  const o=ovr(),age=S.age,ch=[];const lr=S.lastRec;
  const top=topLg(S.lg)&&S.team!=='(무소속)';
  if(!opt.overseas&&kind==='FA'&&top&&(lr&&lr.role!=='2군'||R()<.4)&&(age<37||o>=LG[S.lg].L-2))ch.push(mkOffer(S.team,S.lg,conYears(age,o,S.lg),'잔류'));
  if(!opt.overseas){let n=o>=52?(o>=66?3:2):(o>=48&&age<=31?1:0);if(age>=36)n=o>=LG.KBO.L-4?1:0;pickN(T.KBO.filter(t=>t!==S.team),n).forEach(t=>ch.push(mkOffer(t,'KBO',conYears(age,o,'KBO'))));}
  if(o>=63&&age<=33)pickN(T.NPB.filter(t=>t!==S.team),o>=70?2:1).forEach(t=>ch.push(mkOffer(t,'NPB',conYears(age,o,'NPB'))));
  if(o>=75&&age<=33)pickN(T.MLB.filter(t=>t!==S.team),o>=82?3:o>=77?2:1).forEach(t=>ch.push(mkOffer(t,'MLB',conYears(age,o,'MLB'))));
  else if(o>=68&&age<=29&&R()<.4)ch.push(mkOffer(pick(T.MLB),'MLB',1,'',true));

}
function evFA(kind){

/* ================= 선택 처리 ================= */
function moveTo(team,lg,con,why){

}
const ACT={
  stay(){},
  sign(d){moveTo(d.team,d.lg,{...d.con},d.lg==='MLB'?'메이저리그 계약':d.lg==='NPB'?'일본 진출':'FA 계약');},

  draftKBO(d){S.svc.kbo=0;moveTo(d.team,'KBO',{type:'reserve',sal:.3,cur:'KRW'},d.dev?'육성선수 계약':`신인 계약 (계약금 ${d.b}억원)`);},
  draftMLB(d){S.svc.mlb=0;moveTo(d.team,'MLB',{type:'reserve',sal:.12,cur:'USD'},`마이너 계약 (계약금 $${d.b}M)`);},
  college(d){S.lg='UNIV';S.team=d.team;S.uniYears=0;S.college=true;S.teamSince=S.year;news(`🎓 ${d.team} 진학.`);},
  indie(){const t=pick(T.INDIE);S.lg='INDIE';S.team=t;S.con={type:'amateur',sal:.2,cur:'KRW'};S.teamSince=S.year;news(`독립리그 ${t} 입단. 다시 바닥부터.`);},

  natNo(){S.fame=Math.max(0,S.fame-3);news('대표팀 소집을 고사했다. 일부 팬들은 아쉬움을 표했다.');},
  captain(){S.captainOf.push(S.team);S.fame=Math.min(100,S.fame+4);if(S.stats.men!==undefined)S.stats.men=Math.min(99,S.stats.men+2);else S.stats.eye=Math.min(99,S.stats.eye+1);news(`©️ ${S.team}의 새 주장, ${S.name}.`);},

    }else news(`${S.team}, 포스팅 요청 거절. "아직은 우리 팀에 필요한 선수"`);

    else{S.fame=clamp(S.fame+d.b.fame,0,100);news('🎤 기자회견 발언이 구설에 올랐다. 명성 하락.');}

function enlist(type){

  S.queue=S.queue.filter(e=>!['FA','TRADE','POST','CAP'].includes(e.k));

function choose(i){

}

function requestTrade(){
  S.reqYear=S.year;S.fame=Math.max(0,S.fame-2);
  const ev=evTrade('이적을 요청하자 몇몇 구단이 관심을 보였다.');
  if(ev)S.queue.unshift(ev);else news('이적을 요청했지만 관심을 보이는 구단이 없었다.');
  save();render();
}

/* ================= 은퇴 / 랭킹 ================= */
function careerTotals(){
  const by={};
  S.seasons.forEach(r=>{
    if(!r.line||!topLg(r.playLg))return;
    const t=by[r.playLg]||(by[r.playLg]={seasons:0,G:0,PA:0,AB:0,H:0,HR:0,RBI:0,SB:0,IP:0,W:0,L:0,SV:0,K:0,ER:0,war:0});
    const l=r.line;t.seasons++;t.war+=l.war;t.G+=l.G||0;
    if(POS[S.pos].p){t.IP+=l.IP;t.W+=l.W;t.L+=l.L;t.SV+=l.SV;t.K+=l.K;t.ER+=l.era*l.IP/9;}
    else{t.PA+=l.PA;t.AB+=l.AB;t.H+=l.H;t.HR+=l.HR;t.RBI+=l.RBI;t.SB+=l.SB;}
  });
  return by;
}
function totText(t){
  if(POS[S.pos].p)return `${t.seasons}시즌 · ${t.W}승 ${t.L}패 ${t.SV}세이브 · ERA ${f2(t.IP?t.ER*9/t.IP:0)} · ${Math.round(t.IP)}이닝 · ${t.K}K · WAR ${t.war.toFixed(1)}`;
  return `${t.seasons}시즌 · 타율 ${f3(t.AB?t.H/t.AB:0)} · ${t.H}안타 ${t.HR}홈런 ${t.RBI}타점 ${t.SB}도루 · WAR ${t.war.toFixed(1)}`;
}
function cnt(re){return S.awards.filter(a=>re.test(a.n)).length;}
function doRetire(){
  const tot=careerTotals();const war=Object.values(tot).reduce((a,t)=>a+t.war,0);
  const mvp=cnt(/MVP/),cy=cnt(/사이영|최동원|사와무라/),gg=cnt(/골든글러브|실버슬러거|베스트나인|골드글러브/),champ=cnt(/시리즈 우승/),intl=cnt(/금메달|WBC 우승|프리미어12 우승/),ttl=cnt(/왕$/),rook=cnt(/신인왕/);
  const score=war+mvp*6+cy*4+gg*1.5+ttl+champ*2+intl*2+rook;
  let tier,head;
  const mlbW=tot.MLB?tot.MLB.war:0;
  if(score>=110){tier='전설';head=`"한국 야구가 낳은 최고의 선수" ${S.name}, 화려했던 ${S.seasons.length}년을 마치고 은퇴`;}
  else if(score>=75){tier='명예의 전당';head=`${S.name}, 명예의 전당 헌액 확실시… MVP ${mvp}회의 레전드가 떠난다`;}
  else if(score>=45){tier='레전드';head=`팬들의 기립박수 속에 ${S.name} 은퇴식… "${S.team}의 영원한 ${POS[S.pos].n}"`;}
  else if(score>=20){tier='베테랑';head=`꾸준함의 아이콘 ${S.name}, 정든 그라운드와 작별`;}
  else if(score>=3){tier='저니맨';head=`여러 팀을 오가며 버틴 ${S.name}, 조용히 유니폼을 벗다`;}
  else{tier='꿈을 좇은 선수';head=`프로의 벽은 높았다… ${S.name}, 새로운 인생을 향해`;}
  if(mlbW>=40)head=`메이저리그를 정복한 ${S.name}, 쿠퍼스타운을 바라보며 은퇴`;
  const after=score>=75?pick(['친정팀 감독으로 돌아올 날만 남았다.','방송 해설위원으로 새 출발한다.','국가대표 코치진 합류가 유력하다.']):score>=20?pick(['고향 고교 야구부 코치로 부임했다.','야구 아카데미를 열었다.','구단 프런트에 합류했다.','야구 유튜브 채널을 시작했다.']):pick(['사회인 야구 리그에서 여전히 공을 던진다.','유소년 야구교실 코치가 됐다.','회사원으로 새 삶을 시작했다.','동네 배팅센터를 차렸다.']);
  S.retired=true;
  S.end={tier,head,after,score:+score.toFixed(1),war:+war.toFixed(1),mvp,ttlAwards:S.awards.length,peak:S.peak,tot};
  news(`👋 ${head}`);
  // 로컬 랭킹
  if(S.seasons.some(r=>topLg(r.playLg))){
    try{
      const arr=JSON.parse(localStorage.getItem(RANK_KEY)||'[]');
      arr.push({name:S.name,pos:S.pos,mvp,peak:S.peak,awards:S.awards.length,war:+war.toFixed(1),score:+score.toFixed(1),tier,team:S.team,yrs:S.seasons.length,date:new Date().toISOString().slice(0,10)});
      localStorage.setItem(RANK_KEY,JSON.stringify(arr.slice(-200)));
    }catch(e){}
  }
  save();render();
}
function rankList(){
  let arr=[];try{arr=JSON.parse(localStorage.getItem(RANK_KEY)||'[]');}catch(e){}
  return arr.sort((a,b)=>b.mvp-a.mvp||b.peak-a.peak||b.awards-a.awards||b.war-a.war);
}

  if(q('[data-play]'))q('[data-play]').onclick=playSeason;
  if(q('[data-req]'))q('[data-req]').onclick=requestTrade;
  if(q('[data-retire]'))q('[data-retire]').onclick=()=>confirmModal('정말 은퇴할까요?','은퇴하면 커리어가 끝나고 기록이 명예의 전당에 등록됩니다.','은퇴 선언',doRetire);
  A.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>confirmModal('새 커리어를 시작할까요?','현재 진행 중인 커리어는 사라집니다. (명예의 전당 기록은 남아요)','새로 시작',()=>{S=null;try{localStorage.removeItem(SAVE_KEY);}catch(e){}UI={tab:'news'};render();}));
  if(q('[data-copy]'))q('[data-copy]').onclick=async()=>{try{await navigator.clipboard.writeText(exportCode());toast('세이브 코드를 복사했어요');}catch(e){const t=document.getElementById('exp');t.select();toast('코드를 선택했어요. 직접 복사해 주세요');}};
  if(q('[data-import]'))q('[data-import]').onclick=()=>{try{const v=document.getElementById('imp').value.trim();const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(!o||!o.stats)throw 0;S=o;save();UI.tab='news';render();toast('불러오기 완료');}catch(e){toast('올바른 세이브 코드가 아니에요');}};
}

/* ================= 생성 화면 ================= */
let CF={name:'',pos:'SS',hand:'우투우타',body:'std',hs:T.HS[0]},CANDS=null;
function renderCreate(){
  const lefty=CF.hand.startsWith('좌');
  const bad=lefty&&['C','2B','3B','SS'].includes(CF.pos);
  $app().innerHTML=`<div class="card">
    <h2>선수 만들기</h2>
    <p class="note">고등학교 1학년, 아직은 벤치 멤버. 시즌을 진행하며 훈련·진로·계약을 선택하고, 드래프트와 병역, 해외 진출을 거쳐 명예의 전당을 노리세요. 실명 대신 닉네임을 추천해요.</p>
    <div class="split">
      <div class="field"><label>이름</label><input type="text" id="fname" maxlength="12" placeholder="예: 홍길동" value="${esc(CF.name)}"></div>
      <div class="field"><label>고등학교</label><select id="fhs">${T.HS.map(h=>`<option ${h===CF.hs?'selected':''}>${h}</option>`).join('')}</select></div>
      <div class="field"><label>포지션</label><select id="fpos">${Object.entries(POS).map(([k,v])=>`<option value="${k}" ${k===CF.pos?'selected':''}>${v.n}</option>`).join('')}</select></div>
      <div class="field"><label>투타</label><select id="fhand">${['우투우타','우투좌타','좌투좌타','좌투우타'].map(h=>`<option ${h===CF.hand?'selected':''}>${h}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>체형</label><div class="chips">${[['slim','슬림 (주루·제구↑ 파워↓)'],['std','표준'],['power','파워 (파워·구속↑, 부상 위험↑)']].map(([k,n])=>`<button class="chip ${CF.body===k?'on':''}" data-body="${k}">${n}</button>`).join('')}</div></div>
    ${bad?'<p class="note" style="color:var(--red)">좌투는 포수·2루수·3루수·유격수를 맡기 어려워요. 포지션이나 투타를 바꿔 주세요.</p>':''}
    <p class="note">국적: 대한민국 (병역 의무 적용)</p>
    <button class="btn primary" id="fgo" ${bad?'disabled':''}>스카우트 후보 3명 보기</button>
  </div>
  ${CANDS?`<div class="card"><h2>후보를 골라 주세요</h2><p class="note">세 후보 모두 종합 45, 능력치 합 270에서 시작해요. 잠재력·성장 유형·노화 속도는 숨겨져 있고, 스카우트 평가는 참고용일 뿐이에요.</p>
  <div class="cands">${CANDS.map((c,i)=>`<div class="cand"><h4>후보 ${'ABC'[i]}</h4><div class="note">종합 ${ovrOf(c.stats,CF.pos)} · 스카우트 ${grade(c.potGuess)}</div>
    ${(POS[CF.pos].p?PIT:BAT).map(k=>`<div class="stat"><span>${SN[k]}</span><div class="bar"><i style="width:${c.stats[k]}%"></i></div><span class="num">${c.stats[k]}</span></div>`).join('')}
    <p class="note" style="min-height:36px">${SCOUT[grade(c.potGuess)]}</p>
    <button class="btn green" data-pick="${i}" style="width:100%">이 선수로 시작</button></div>`).join('')}</div>
  <div style="margin-top:12px"><button class="btn ghost" id="freroll">다른 후보 보기</button></div></div>`:''}
  <div class="card"><h2>명예의 전당</h2>${hofView()}</div>`;
  const sync=()=>{CF.name=document.getElementById('fname').value;CF.hs=document.getElementById('fhs').value;};
  document.getElementById('fpos').onchange=e=>{sync();CF.pos=e.target.value;CANDS=null;renderCreate();};
  document.getElementById('fhand').onchange=e=>{sync();CF.hand=e.target.value;renderCreate();};
  document.querySelectorAll('[data-body]').forEach(b=>b.onclick=()=>{sync();CF.body=b.dataset.body;CANDS=null;renderCreate();});
  const gen=()=>{sync();CANDS=[0,1,2].map(()=>makeCandidate(CF.pos,CF.body));renderCreate();};
  document.getElementById('fgo').onclick=gen;
  if(document.getElementById('freroll'))document.getElementById('freroll').onclick=gen;
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{sync();if(!CF.name.trim()){toast('이름을 입력해 주세요');return;}startGame({...CF,name:CF.name.trim()},CANDS[+b.dataset.pick]);CANDS=null;});
}

/* ================= 시작 ================= */
S=load();
if(S&&!S.stats)S=null;
render();
</script>
</body>
</html>
