<style>
:root{
  --paper:#f3ede0; --paper2:#e9e1cf; --ink:#18263a; --ink2:#46566c; --muted:#8a8f97;
  --red:#c4352b; --green:#1f5a42; --green2:#2c7a59; --gold:#d8a521; --line:#d3c9b3;
  --board:#13261d; --digit:#f5d34a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5}
body{background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:4px 4px}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 60px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.logo{font-family:'Black Han Sans';font-size:30px;letter-spacing:-.5px;line-height:1}
.logo span{color:var(--red)}
.tag{font-size:12px;color:var(--ink2);margin-top:4px}
.stitch{height:10px;background:repeating-linear-gradient(115deg,var(--red) 0 3px,transparent 3px 9px);opacity:.75;width:120px;border-radius:3px}
.grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px}
.grid>div{min-width:0}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:#fffdf7;border:1.5px solid var(--ink);border-radius:10px;padding:16px;box-shadow:3px 3px 0 var(--ink)}
.card+.card{margin-top:16px}
h2{font-family:'Black Han Sans';font-weight:400;font-size:20px;margin:0 0 10px}
h3{font-size:14px;margin:14px 0 6px;color:var(--ink2);font-weight:700}
.pc-head{display:flex;gap:12px;align-items:center}
.ovr{background:var(--board);color:var(--digit);border-radius:8px;width:76px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 3px #0a1711,inset 0 0 0 4px #2f4a3c}
.ovr b{font-family:'Oswald';font-size:36px;line-height:1}
.ovr small{font-size:10px;letter-spacing:2px;color:#cfe3d6}
.pname{font-family:'Black Han Sans';font-size:22px;line-height:1.1}
.psub{font-size:13px;color:var(--ink2)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{font-size:12px;border:1px solid var(--ink);border-radius:99px;padding:1px 9px;background:var(--paper)}
.badge.r{background:var(--red);color:#fff;border-color:var(--red)}
.badge.g{background:var(--green);color:#fff;border-color:var(--green)}
.stat{display:grid;grid-template-columns:52px 1fr 30px;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.bar{height:9px;background:var(--paper2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--green))}
.bar i.hi{background:linear-gradient(90deg,#e0b43a,var(--gold))}
.num{font-family:'Oswald';text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:500}
.btn{border:1.5px solid var(--ink);background:#fffdf7;color:var(--ink);border-radius:8px;padding:9px 14px;font-weight:700;font-size:14px;box-shadow:2px 2px 0 var(--ink);transition:transform .06s}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{box-shadow:none;border-color:var(--line);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.big{font-size:18px;padding:14px 22px;width:100%;font-family:'Black Han Sans';font-weight:400;letter-spacing:.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.choice{display:block;width:100%;text-align:left;border:1.5px solid var(--ink);border-radius:9px;background:#fff;padding:11px 14px;margin:8px 0;box-shadow:2px 2px 0 var(--ink)}
.choice:hover{background:#fff8e6}
.choice b{display:block;font-size:15px}
.choice span{font-size:12.5px;color:var(--ink2)}
.ev-kicker{font-size:12px;letter-spacing:2px;color:var(--red);font-weight:900}
.ev-title{font-family:'Black Han Sans';font-size:24px;line-height:1.2;margin:2px 0 8px}
.ev-desc{color:var(--ink2);font-size:14px;white-space:pre-line}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--ink);border-radius:99px;padding:5px 12px;background:#fff;font-size:13px;font-weight:500}
.chip.on{background:var(--ink);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin:-4px 0 12px;flex-wrap:wrap}
.tab{border:none;background:none;padding:8px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--ink);border-color:var(--red)}
.news{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto}
.news li{padding:8px 2px;border-bottom:1px dashed var(--line);font-size:13.5px}
.news li em{font-style:normal;font-family:'Oswald';color:var(--red);margin-right:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;color:var(--muted);font-weight:700;background:var(--paper)}
td.n{font-family:'Oswald';text-align:right;white-space:nowrap}
.tblwrap{overflow:auto;max-height:480px}
.lgtag{font-size:10.5px;border-radius:4px;padding:0 5px;color:#fff;background:var(--ink2);white-space:nowrap}
.lg-KBO{background:#2c4f8c}.lg-MLB{background:#b3261e}.lg-NPB{background:#1d1d1d}.lg-FUT,.lg-AAA,.lg-NPB2{background:#8a8f97}.lg-HS,.lg-UNIV,.lg-INDIE{background:#6b7b4a}.lg-MIL,.lg-ARMY{background:#5b6b3a}
.award{display:inline-block;font-size:11px;background:#fff1c7;border:1px solid var(--gold);border-radius:4px;padding:0 5px;margin:1px 2px 1px 0;white-space:nowrap}
.field{margin:10px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;border:1.5px solid var(--ink);border-radius:8px;padding:8px 10px;background:#fff}
textarea{font-family:monospace;font-size:11px;height:90px}
.cands{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.cands{grid-template-columns:1fr}}
.cand{border:1.5px solid var(--ink);border-radius:10px;padding:12px;background:#fff;box-shadow:2px 2px 0 var(--ink)}
.cand h4{margin:0 0 4px;font-family:'Black Han Sans';font-weight:400;font-size:18px}
.note{font-size:12px;color:var(--muted)}
.timebar{position:absolute;left:0;right:0;top:0;height:6px;background:var(--paper2);border-radius:12px 12px 0 0;overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--gold));transform-origin:left;animation:tb 2s linear forwards}
@keyframes tb{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.modal.timed.paused .timebar i{animation-play-state:paused;opacity:.55}
.modal.timed{position:relative;padding-top:24px}
.xbtn{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;font-size:18px;line-height:1;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:1px 1px 0 var(--ink)}
.xbtn:hover{background:#fff1c7}
.stwrap{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:8px;background:#fff}
.stbl{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
.stbl th{position:sticky;top:0;background:var(--ink);color:#fff;font-weight:700;font-size:12.5px;padding:9px 10px;text-align:center;white-space:nowrap;z-index:2}
.stbl td{padding:8px 10px;text-align:center;border-bottom:1px solid #eef0f3;font-family:'Oswald';font-weight:500;white-space:nowrap;color:#3b4555}
.stbl td:first-child,.stbl th:first-child{position:sticky;left:0;z-index:1;border-right:1px solid #e3e6ea}
.stbl th:first-child{z-index:3;background:var(--ink)}
.stbl td:first-child{background:#fff;font-family:'Noto Sans KR';font-weight:700;color:var(--ink);text-align:left}
.stbl td.tm{font-family:'Noto Sans KR';font-weight:500;font-size:12px;text-align:left;color:var(--ink2)}
.stbl tr.tot td{background:#eef3fb;font-weight:700;color:var(--ink)}
.stbl tr.tot td:first-child{background:#e3ecf8}
.stbl tr.farm td{color:#9aa1ab}
.stbl tr.farm td:first-child{color:#9aa1ab}
.stbl td.lead{color:var(--red);font-weight:700}
.stbl tr:hover td{background:#fbf6e9}
.subh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:16px 0 8px}
.subh h3{margin:0}
.rkbar{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:6px;padding:10px 14px;margin:12px 0 10px;flex-wrap:wrap}
.rkbar .tro{font-size:20px;padding-right:12px;border-right:1px solid rgba(255,255,255,.25)}
.rkbar span{font-weight:700;font-size:14.5px;white-space:nowrap}
.rkbar b{color:#f5b54a}
.rkbar i{font-style:normal;opacity:.45}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #e3e6ea;border-radius:6px;overflow:hidden;background:#f8f9fb}
.sgrid div{padding:12px 6px;text-align:center;border-right:1px solid #e9ecef;border-bottom:1px solid #e9ecef}
.sgrid div:nth-child(4n){border-right:none}.sgrid div:nth-last-child(-n+4){border-bottom:none}
.sgrid small{display:block;font-size:12.5px;color:#7a828d}
.sgrid b{display:block;font-family:'Oswald';font-size:24px;line-height:1.25;color:#4a525d}
.sgrid div.hl small{font-weight:700}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.minis div{background:var(--paper);border-radius:6px;padding:8px 10px}
.minis small{display:block;font-size:11.5px;color:var(--muted)}
.minis b{font-family:'Oswald';font-size:18px}
.jno{display:inline-block;font-family:'Oswald';font-weight:700;font-size:15px;background:var(--red);color:#fff;border-radius:5px;padding:0 7px;margin-right:7px;vertical-align:3px}
.fold{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;width:100%;font-size:14px;font-weight:700;color:var(--ink2);margin:14px 0 6px;cursor:pointer}
.fold .chev{font-size:12px;font-weight:500;color:var(--muted)}
.fbody.closed{display:none}
@media(min-width:861px){.fold{cursor:default;pointer-events:none}.fold .chev{display:none}.fbody.closed{display:block}}
.need{margin-top:10px;background:#fff6dc;border:1.5px solid var(--gold);border-radius:8px;padding:9px 12px;font-size:14px}
.need b{color:var(--red)}
.need.hit{background:#e7f4ec;border-color:var(--green2)}
@media(max-width:600px){.hm{display:none}.logo{font-size:24px}}
.logo,.tag{word-break:keep-all}
.overlay{position:fixed;inset:0;background:rgba(15,25,35,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fffdf7;border:2px solid var(--ink);border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:5px 5px 0 var(--ink)}
.scoreline{background:var(--board);color:#e8f2ec;border-radius:8px;padding:12px 14px;font-family:'Oswald';letter-spacing:.3px;font-size:15px;margin:10px 0}
.scoreline b{color:var(--digit)}
.delta{font-family:'Oswald';font-size:28px}
.delta .up{color:var(--green2)} .delta .dn{color:var(--red)}
.endhead{font-family:'Black Han Sans';font-size:28px;line-height:1.25;margin:6px 0 10px}
.tier{display:inline-block;background:var(--gold);color:#2a1f00;font-weight:900;border-radius:6px;padding:2px 10px;font-size:13px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bn{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bn div{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;font-size:12.5px}
.bn div b{display:block;font-size:11px;color:var(--red)}
.chip.autopick{background:var(--red)!important;color:#fff!important;box-shadow:0 0 0 3px rgba(200,50,40,.25)!important;animation:pick .35s var(--ease)}
@keyframes pick{from{transform:scale(.9)}to{transform:scale(1)}}
.btn.autopress{filter:brightness(.62);transform:scale(.97);transition:filter .25s,transform .25s}
.mtags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px}
.mtags span{background:#8a8d93;color:#fff;font-size:13px;font-weight:600;padding:1px 6px;border-radius:2px;line-height:1.4;white-space:nowrap}
@media(max-width:600px){.actrow{gap:6px!important;flex-wrap:nowrap!important}.actrow .btn{padding:8px 10px;font-size:13px;white-space:nowrap}.actrow .btn .ic{width:14px;height:14px}}
.autobar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:8px 8px 8px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;font-weight:600}
.autobar span{display:flex;align-items:center;gap:8px}.autobar .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 1s ease-in-out infinite alternate}
.autobar .btn{background:#fff;color:var(--ink);padding:6px 14px;font-size:13px;min-height:0}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.toast{bottom:76px!important;line-height:1.5;text-align:center;position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:90vw}

/* ===== 디자인 정돈 =====
   make-interfaces-feel-better: 폰트 스무딩, 숫자 폭 고정, 제목 줄바꿈 균형, 누름 0.96, 터치 영역 44px, transition 속성 지정, 이모지 대신 SVG 아이콘
   ui-ux-pro-max: 본문 대비 4.5:1 이상, 포커스 링, 동작 줄이기 존중, 8px 간격 리듬
   frontend-design: 영문 대문자 아이브로 제거, 강한 테두리·하드 섀도는 '야구 카드' 표면(카드·주요 버튼·모달)에만 */
:root{
  --muted:#5f6772; --surface:#fffdf7; --ink2:#3f4d61;
  --r-card:16px; --r-ctl:10px; --r-tag:6px;
  --ring:0 0 0 1px rgba(24,38,58,.16),0 1px 2px -1px rgba(24,38,58,.12),0 2px 4px rgba(24,38,58,.05);
  --ring-hover:0 0 0 1px rgba(24,38,58,.32),0 2px 4px -1px rgba(24,38,58,.14),0 4px 10px rgba(24,38,58,.08);
  --ease:cubic-bezier(.2,0,0,1);
}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,.ev-title,.endhead,.pname,.logo{text-wrap:balance}
p,.ev-desc,.note,.choice span,.news li,.need{text-wrap:pretty}
.num,.ovr b,.delta,.minis b,.sgrid b,.stbl td,td.n,.jno,.kv dd,.rkbar b{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ic{width:1em;height:1em;flex:none;vertical-align:-.14em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.wrap{padding:24px 16px 64px}
header.top{margin-bottom:24px}
.tag{font-size:12.5px}
.grid{gap:24px}
.card{border-radius:var(--r-card);padding:20px}
.card+.card{margin-top:24px}
@media(max-width:600px){.wrap{padding:16px 12px 48px}.card{padding:16px}.card+.card{margin-top:16px}.grid{gap:16px}}

.ev-kicker{display:inline-flex;align-items:center;gap:6px;letter-spacing:0;font-size:12.5px;font-weight:700;color:var(--ink2);background:var(--paper2);border-radius:999px;padding:3px 10px;margin-bottom:8px}
.ev-kicker.hot{background:#fbe3df;color:#9c2a21}
.ev-title{margin:0 0 8px}

.btn{min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s var(--ease),box-shadow .12s var(--ease),background-color .15s var(--ease)}
.btn.ghost{border:none;box-shadow:var(--ring);background:var(--surface);color:var(--ink)}
.btn.ghost:hover{box-shadow:var(--ring-hover)}
.btn.ghost:active{transform:scale(.96)}
.btn.big{min-height:56px}
.btn.big .ic{width:18px;height:18px;margin-left:2px;fill:currentColor;stroke:none} /* 재생 삼각형은 광학 중심을 위해 오른쪽으로 2px */

.choice{border:none;box-shadow:var(--ring);border-radius:var(--r-ctl);padding:14px 16px;margin:10px 0;min-height:56px;transition:box-shadow .15s var(--ease),background-color .15s var(--ease),transform .15s var(--ease)}
.choice:hover{background:#fffaf0;box-shadow:var(--ring-hover)}
.choice:active{transform:scale(.96)}
.choice b{font-size:15.5px;margin-bottom:2px}
.choice span{color:var(--ink2);line-height:1.5}
.pill{display:inline-block;vertical-align:2px;margin-left:6px;font-size:11.5px;font-weight:700;color:#1d5c40;background:#e2f2e8;border-radius:999px;padding:1px 8px}

.chips{gap:8px}
.chip{border:none;box-shadow:var(--ring);min-height:40px;padding:8px 14px;color:var(--ink);transition:box-shadow .15s var(--ease),background-color .15s var(--ease),color .15s var(--ease),transform .15s var(--ease)}
.chip:hover{box-shadow:var(--ring-hover)}
.chip.on{box-shadow:none;background:var(--ink);color:#fff}
.chip:active{transform:scale(.96)}

.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:2px;margin:-4px -4px 16px;padding:0 4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:44px;padding:10px 14px;transition:color .15s var(--ease),border-color .15s var(--ease)}
.tab:hover{color:var(--ink)}

.fold{min-height:36px}
@media(pointer:coarse){.chip,.tab,.btn,.fold{min-height:44px}}
@media(max-width:600px){.tab{padding:10px 9px;font-size:14px}}

input[type=text],input[type=number],select,textarea{min-height:44px;border:none;box-shadow:var(--ring);border-radius:var(--r-ctl);transition:box-shadow .15s var(--ease)}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 2px var(--ink)}
.cand{border:none;box-shadow:var(--ring);border-radius:12px;padding:16px}

.xbtn{width:36px;height:36px;border:none;box-shadow:var(--ring);transition:box-shadow .15s var(--ease),transform .15s var(--ease)}
.xbtn::before{content:'';position:absolute;inset:-4px}
.xbtn:hover{box-shadow:var(--ring-hover)}
.xbtn:active{transform:scale(.96)}
.xbtn .ic{width:18px;height:18px}
.modal{border-radius:20px}
.timebar{border-radius:20px 20px 0 0}

.news li{display:flex;gap:10px;align-items:flex-start;padding:10px 2px}
.news li em{flex:none;margin-right:0}
.news li .ic{width:16px;height:16px;margin-top:3px;color:var(--ink2)}
.news li .ic.gold{color:#b8860b}.news li .ic.red{color:var(--red)}.news li .ic.green{color:var(--green2)}
.award{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:var(--r-tag)}
.award .ic{color:#9a6f00}
.lgtag{font-size:11px;padding:1px 6px}
.lg-FUT,.lg-AAA,.lg-NPB2{background:#6b7280}
.need{display:flex;gap:10px;align-items:flex-start;border:none;box-shadow:inset 0 0 0 1.5px var(--gold);border-radius:var(--r-ctl);padding:12px 14px}
.need.hit{box-shadow:inset 0 0 0 1.5px var(--green2)}
.need>.ic{width:18px;height:18px;margin-top:2px;color:var(--red)}
.need.hit>.ic{color:var(--green2)}
.rkbar{border-radius:10px}
.rkbar .tro{display:flex;font-size:0}.rkbar .tro .ic{width:20px;height:20px;color:#f5b54a}
.sgrid{border-radius:10px}
.sgrid small{color:var(--muted)}
.minis div{border-radius:10px}
.stbl tr.farm td,.stbl tr.farm td:first-child{color:#6b7280}
.stat{margin:6px 0}
.kv{gap:6px 12px}
.ovr small{font-size:11px;letter-spacing:1px}
#hdr .btn .ic{width:15px;height:15px}
@media(prefers-reduced-motion:reduce){.btn,.chip,.choice,.tab,.xbtn,input,select{transition:none}.btn:active,.chip:active,.choice:active,.xbtn:active,.btn.ghost:active{transform:none}}
.news li.hl span{font-weight:600;color:var(--ink)}
.news li.hl .ic{color:var(--red)}
.avwrap{width:84px;height:84px;flex:none;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 3px #0a1711,0 0 0 1px #0a1711}
.avwrap .avatar{display:block;width:100%;height:100%;image-rendering:pixelated}
.ovrchip{display:inline-flex;align-items:center;gap:5px;background:var(--board);color:#cfe3d6;border-radius:99px;padding:1px 10px;font-size:11.5px;font-weight:700;letter-spacing:.5px}
.ovrchip b{font-family:'Oswald';font-size:15px;color:var(--digit);letter-spacing:0;font-variant-numeric:tabular-nums}
.cand .cav{width:56px;height:56px;border-radius:10px;overflow:hidden;flex:none;box-shadow:inset 0 0 0 2px #0a1711}
.cand .cav .avatar{display:block;width:100%;height:100%}
.cand .chead{display:flex;gap:10px;align-items:center;margin-bottom:6px}
</style>

  const out=[],seen=new Set();

  if(S.natNoY&&S.natNoY.includes(rec.year)){const ev=S.natNoEv&&S.natNoEv[rec.year]||'국가대표';add(99,'natno',[`‘태극마크보다 소속팀?’ ${N}, ${ev} 대표팀 소집 고사에 팬들 싸늘`,`${ev} 앞둔 대표팀, ${N} 불참 선언에 ‘아쉽다’…감독도 말 아꼈다`,`대표팀 대신 소속팀 택한 ${N}, 엇갈리는 시선`,`${N} 대표팀 고사 후폭풍…“몸 관리” 해명에도 비판 여론 확산`]);}

function makeCandidate(pos,body){
  const hb={slim:[178,21],std:[181,24],power:[184,28]}[body]||[181,24];
  const h=Math.round(clamp(hb[0]+(POS[pos].p?2:0)+randn()*4.5,165,200)), wt=Math.round(clamp(hb[1]+randn()*1.3,18.5,34)*Math.pow(h/100,2));
  const w=POS[pos].w, ks=POS[pos].p?PIT:BAT;
  const mw=ks.reduce((a,k)=>a+w[k],0)/6;
  const st={};
  ks.forEach(k=>{
    let v=45+(w[k]-mw)*11+randn()*5;
    if(body==='slim'){ if(k==='spd'||k==='ctl'||k==='def')v+=4; if(k==='pow'||k==='vel'||k==='stf')v-=4;}
    if(body==='power'){ if(k==='pow'||k==='vel'||k==='stf')v+=5; if(k==='spd'||k==='ctl')v-=4;}
    st[k]=v;
  });
  // 키·몸무게: 체중이 무거울수록 힘↑ 발↓, 키가 클수록 투수는 구속↑, 타자는 파워·어깨↑
  if(h&&wt){
    const b=clamp((wt/Math.pow(h/100,2)-24.5)*.9,-4,4), hh=clamp((h-182)*.25,-3,3);
    const add=(k,v)=>{if(st[k]!==undefined)st[k]+=v;};
    add('pow',b);add('stf',b);add('spd',-b);add('def',-b*.4);
    if(POS[pos].p){add('vel',hh);add('stf',hh*.5);add('ctl',-hh*.3);}else{add('pow',hh*.6);add('arm',hh*.4);add('spd',-hh*.3);}
  }
  // 합계 정규화 (능력치 평균 45)
  const TOT=45*ks.length;
  let sum=ks.reduce((a,k)=>a+st[k],0);
  ks.forEach(k=>st[k]=clamp(Math.round(st[k]*TOT/sum),28,64));
  sum=ks.reduce((a,k)=>a+st[k],0);
  let i=0;while(sum!==TOT&&i<300){const k=ks[i%ks.length];if(sum<TOT&&st[k]<64){st[k]++;sum++;}else if(sum>TOT&&st[k]>28){st[k]--;sum--;}i++;}
  // 종합 45로 맞추기 (가중치 높은 능력치 ↔ 낮은 능력치 이동)
  const sorted=ks.slice().sort((a,b)=>w[b]-w[a]);
  let g=0;
  while(ovrOf(st,pos)!==45&&g<300){
    const o=ovrOf(st,pos);
    const hi=sorted[g%2], lo=sorted[5-(g%2)];
    if(o<45&&st[lo]>28&&st[hi]<64){st[lo]--;st[hi]++;}
    else if(o>45&&st[hi]>28&&st[lo]<64){st[hi]--;st[lo]++;}
    g++;
  }
  const pot=Math.round(50+40*Math.pow(R(),2.5)+(R()<.03?5:0));
  const tr=R();
  const bmi=h&&wt?wt/Math.pow(h/100,2):24;
  return {look:(R()*4294967295)>>>0,h,w:wt,stats:st,pot,inj2:bmi>=30?1.15:bmi<20?1.08:1,trait:tr<.2?'early':tr<.32?'late':'normal',aging:rnd(.75,1.3),injury:rnd(.7,1.3),potGuess:clamp(pot+rint(-10,10),50,99)};
}

const POS_BONUS={C:3,SS:1.5,CF:1,'2B':.5,'3B':0,LF:-.5,RF:-.5,'1B':-1,DH:-2.5,SP:0,RP:.5};
function perfScore(r){ // 직전 시즌 성적 평가 (-3 ~ +3)
  if(!r||!r.line)return 0;const l=r.line;
  if(POS[S.pos].p){if(!l.IP||l.IP<15)return 0;const w=Math.min(1,l.IP/(S.pos==='SP'?100:40));return clamp((4.3-l.era)*.9,-3,3)*w;}
  if(!l.PA||l.PA<60)return 0;const w=Math.min(1,l.PA/300);return clamp((l.ops-.735)*14,-3,3)*w;
}
function roleInfo(o,lg,team){
  const L=LG[lg].L+(S.teamOff[team]||0);
  const pb=POS_BONUS[S.pos]||0, perf=+perfScore(S.lastRec).toFixed(1), nb=needHit(team,lg)?2:0;
  const d=o-L+pb+perf+nb;let r;
  if(d>=4)r='핵심';else if(d>=-1)r='주전';else if(d>=-5)r='로테이션';else if(d>=-9)r='백업';else r=LG[lg].farm?'2군':'벤치';
  // 타격은 모자라도 발·수비가 1군급이면 대주자·대수비 요원으로 콜업
  if(r==='2군'&&!POS[S.pos].p){
    const sp=S.stats.spd-L, df=S.stats.def*.7+S.stats.arm*.3-L;
    const canRun=!['C','1B','DH'].includes(S.pos), canDef=['C','SS','2B','3B','CF'].includes(S.pos);
    const runOk=canRun&&sp>=-4&&S.stats.spd-o>=6, defOk=canDef&&df>=-5&&S.stats.def-o>=5;
    if(d>=-16){if(runOk&&(!defOk||sp>=df))r='대주자';else if(defOk)r='대수비';}
  }
  return {role:r,L:Math.round(L),pb,perf,d:+d.toFixed(1)};
}

/* 연봉 단위: KRW=만원, USD=백만달러, JPY=만엔
   기준(2026): KBO 최저 3,000만원(2027~ 3,300만원), 1군 최저 6,500만원(등록일수 비례 보전), 평균 1억7,536만원, 최고 42억원
   MLB 최저 $78만, AAA 시즌 약 $3.7만, 평균 $534만 / NPB 1군 최저 1,600만엔, 중앙값 2,000만엔, 일본인 최고 6억엔 */
const FX={USD:1450,JPY:9.3}; // 1달러=1,450원, 1엔=9.3원
function kboMin(y){return (y||S.year)>=2027?3300:3000;}
const KBO_1GUN_MIN=6500, MLB_MIN=.78, AAA_PAY=.037, LOWA_PAY=.027;
function expWar(o,lg){return (o-LG[lg].L)*.45+(lg==='MLB'?2:lg==='NPB'?1:1.5);}
function ageF(age){return (age>=37?.45:age>=35?.6:age>=33?.8:1)*(S.pos==='RP'?.65:1);} // 불펜은 몸값이 낮다
function kboFA(o,age){const w=Math.max(0,expWar(o,'KBO'));let v=(.5+2.6*Math.pow(w,1.2))*ageF(age)*(1+S.fame/700);return Math.round(clamp(v,kboMin()/10000,32)*100)*100;} // 만원
function mlbFA(o,age,post){const w=Math.max(0,expWar(o,'MLB'));let v=(MLB_MIN+6.5*Math.pow(w,1.15))*ageF(age);if(post&&age<=28)v*=1.2;return +clamp(v,MLB_MIN,62).toFixed(2);} // $M
function npbFA(o,age){const w=Math.max(0,expWar(o,'NPB'));let v=(3000+4500*Math.pow(w,1.2))*ageF(age);return Math.round(clamp(v,1600,120000)/100)*100;} // 만엔
function toKRW(sal,cur){return cur==='USD'?sal*FX.USD*100:cur==='JPY'?sal*FX.JPY:sal;} // → 만원
function wonFmt(m){m=Math.round(m);if(m<10000)return m.toLocaleString()+'만원';const e=Math.floor(m/10000),r=Math.round((m%10000)/100)*100;return e.toLocaleString()+'억'+(r?' '+r.toLocaleString()+'만':'')+'원';}
function yenFmt(m){m=Math.round(m);if(m<10000)return m.toLocaleString()+'만 엔';const e=Math.floor(m/10000),r=Math.round((m%10000)/100)*100;return e+'억'+(r?' '+r.toLocaleString()+'만':'')+' 엔';}
function usdFmt(M){const man=M*100;return (man>=100?Math.round(man).toLocaleString():(+man.toFixed(1)).toLocaleString())+'만 달러';}
function salFmt(c,approx){if(!c)return '-';
  if(c.cur==='USD')return usdFmt(c.sal)+(approx?` (약 ${wonFmt(toKRW(c.sal,'USD'))})`:'');
  if(c.cur==='JPY')return yenFmt(c.sal)+(approx?` (약 ${wonFmt(toKRW(c.sal,'JPY'))})`:'');
  return wonFmt(c.sal);}
function kboPreTarget(rec){ // 보류(비FA) 선수 연봉 협상 목표치 (만원)
  const w=rec&&rec.line?rec.line.war:0, onFirst=rec&&topLg(rec.playLg);
  if(!onFirst)return Math.min(5000,S.con.sal+(w>1.5?500:w>0?200:0));
  const perf=(3000*Math.max(0,w)+3000*Math.pow(Math.max(0,w-3),1.7))*(1+.12*S.svc.kbo);
  return 5000+perf+400*S.svc.kbo+S.fame*40;
}
function seasonPay(rec){ // 이번 시즌 실제 수령액 (만원), 계약금 제외
  const c=S.con;if(!c||c.type==='amateur'||rec.lg==='ARMY'||rec.lg==='MIL')return 0;
  const farm=!topLg(rec.playLg);
  if(c.cur==='USD'){
    if(c.type==='reserve'||c.split)return toKRW(farm?(S.age<21?LOWA_PAY:AAA_PAY):Math.max(c.sal,MLB_MIN),'USD');
    return toKRW(c.sal,'USD');}
  if(c.cur==='JPY')return toKRW(c.sal,'JPY');
  let pay=c.sal;
  if(!farm&&pay<KBO_1GUN_MIN)pay+= (KBO_1GUN_MIN-pay)*({핵심:1,주전:1,로테이션:.85,백업:.6,대수비:.5,대주자:.45,콜업:.35,강등:.5}[rec.role]||.5);
  if(farm&&c.type==='fa'&&c.sal>=30000){pay*=.5;rec.notes.push('부진 2군행 연봉 50% 감액');}
  return pay;
}
function conYears(age,o,lg){let y=age<=29?4:age<=32?3:age<=35?2:1;if(lg==='MLB'&&o>=LG.MLB.L+8&&age<=30)y+=2;return y;}

/* ================= 시즌 시뮬 ================= */
const FP={C:[7.5,.008,1.0],'1B':[9,.005,.4],'2B':[4.8,.017,1.0],SS:[4.5,.025,1.2],'3B':[2.7,.04,.9],LF:[2,.015,.7],CF:[2.6,.012,1.1],RF:[2.1,.017,.8]}; // [경기당 수비 기회, 기본 실책률, 수비 가치 배율]
function simField(L,fg){ // fg: 수비로 뛴 경기 수(9이닝 환산)
  const f=FP[S.pos];if(!f||fg<1)return null;const s=S.stats,dr=s.def-L,ar=s.arm-L;
  const TC=Math.round(f[0]*fg*rnd(.9,1.1));
  const E=Math.max(0,Math.round(TC*f[1]*clamp(1-dr*.03,.35,1.9)*rnd(.6,1.4)));
  const drs=Math.round(((dr*.7+ar*.3)*.35*f[2]+randn()*2.5)*fg/130);
  const o={inn:Math.round(fg*8.7),TC,E,fpct:TC?(TC-E)/TC:1,drs};
  if(S.pos==='C'){o.sba=Math.round(fg*.8*rnd(.8,1.2));o.cs=Math.round(o.sba*clamp(.24+ar*.008+randn()*.03,.08,.55));}
  if(['LF','CF','RF'].includes(S.pos))o.ast=Math.max(0,Math.round((ar*.12+rnd(1,5))*fg/130));
  return o;
}
const AMP={HS:3,UNIV:2,INDIE:1.6}; // 아마추어 리그는 실력 차이가 커서 능력 차이가 기록에 더 크게 드러난다
function ampStats(lg){const L=LG[lg].L,a=AMP[lg]||1;if(a===1)return {s:S.stats,rel:ovr()-L};const s={};for(const k in S.stats)s[k]=L+(S.stats[k]-L)*a;return {s,rel:(ovr()-L)*a};}
function simBat(lg,pt,avail,role){
  const L=LG[lg].L,G=LG[lg].G,o=ovr(),{s,rel}=ampStats(lg);
  /* 출장 경기: 주전도 휴식·잔부상으로 전 경기 출장은 드물다. 포수는 체력 부담으로 120경기대, 유격수·중견수는 130경기대 중후반이 보통 */
  const gf={C:[.85,.05],SS:[.94,.04],CF:[.93,.04],'2B':[.92,.05],'3B':[.92,.05],'1B':[.91,.05],LF:[.91,.05],RF:[.91,.05],DH:[.87,.06]}[S.pos]||[.92,.05];
  const share=pt>=.9?clamp(gf[0]+randn()*gf[1],.72,1):pt>=.5?clamp(.72+randn()*.08,.5,.9):pt>=.2?clamp(.48+randn()*.1,.25,.7):clamp(pt*2.5+randn()*.05,.05,.5);
  let games=Math.min(G,Math.round(G*share*avail));
  const ppg=pt>=.9?(S.pos==='C'?3.85:4.2):pt>=.5?3.1:pt>=.2?2.2:1.7; // 경기당 타석
  let PA=Math.max(0,Math.round(games*ppg*rnd(.95,1.05)));
  let fg=games*(pt>=.9?.96:pt>=.5?.85:.6);
  if(role==='대주자'){games=Math.round(G*.45*avail);PA=Math.round(games*.35);fg=games*.08;}
  if(role==='대수비'){games=Math.round(G*.4*avail);PA=Math.round(games*.9);fg=games*.3;}
  const field=simField(L,fg);
  if(PA<5){const sb0=role==='대주자'?Math.max(0,Math.round((s.spd-L)*.6*avail+rnd(1,5))):0;return {G:games,PA,AB:PA,H:0,D2:0,D3:0,HR:0,RBI:0,R:sb0?Math.round(sb0*.6):0,SB:sb0,BB:0,SO:0,avg:0,obp:0,slg:0,ops:0,war:field?+(field.drs/10).toFixed(1):0,field};}
  const nz=Math.sqrt(400/Math.max(PA,40));
  const base={HS:.365,UNIV:.3}[lg]||.262; // 고교·대학은 투수 수준 차이가 커서 타율이 높게 나온다 (프로 지명급 고교 타자는 4할대)
  const avg=clamp(base+(s.con-L)*.0032+rel*.0012+randn()*.017*nz,.12,lg==='HS'?.6:.405);
  const bbr=clamp(.085+(s.eye-L)*.0022+randn()*.01,.03,.2);
  const BB=Math.round(PA*bbr), AB=Math.max(1,PA-BB-Math.round(PA*.012));
  const H=Math.round(AB*avg);
  const HR=Math.max(0,Math.round(AB*Math.max(.004,.03+(s.pow-L)*.0021+randn()*.004)));
  const D2=Math.round((H-HR)*rnd(.17,.23)), D3=Math.max(0,Math.round((H-HR)*Math.max(0,(s.spd-L)*.0015+.008)));
  const slg=(H+D2+2*D3+3*HR)/AB, obp=(H+BB)/PA;
  const sr=s.spd-L;
  let SB=Math.max(0,Math.round((Math.max(0,sr+6)*1.15+Math.max(0,sr-6)*1.6)*PA/600+randn()*4*Math.sqrt(PA/600)));
  if(role==='대주자')SB+=Math.max(0,Math.round(sr*.6*avail+rnd(1,5)));
  const RBI=Math.max(0,Math.round(HR*2.4+(H-HR)*.32+randn()*6));
  const SO=Math.max(0,Math.round(PA*clamp(.19-(s.con-L)*.003+(s.pow-L)*.0012+randn()*.022,.05,.36)));
  const Rn=Math.max(0,Math.round((H+BB)*.31+HR*.62+SB*.22+randn()*6));
  const ops=obp+slg, p=POS[S.pos];
  const war=PA/650*((ops-.735)*21+1.5+(p.adj||0))+(field?field.drs/10:0)+(role==='대주자'?SB*.02:0);
  return {G:games,PA,AB,H,D2,D3,HR,RBI,R:Rn,SB,BB,SO,avg:H/AB,obp,slg,ops,war:+war.toFixed(1),field};
}
function simPit(lg,role,pt,avail){
  const L=LG[lg].L,G=LG[lg].G,o=ovr(),{s,rel}=ampStats(lg),sp=S.pos==='SP';
  let GS=0,RG=0;
  if(sp){
    if(role==='핵심'||role==='주전')GS=G/5.2;
    else if(role==='로테이션'){GS=G/5.2*.45;RG=15;}
    else if(role==='백업'){GS=rint(0,3);RG=30;}
    else {GS=G/5.2*.3;RG=4;}
  }else{
    RG=G*({핵심:.42,주전:.45,로테이션:.3,백업:.15,벤치:.12}[role]||.2);
  }
  GS=Math.round(GS*avail);RG=Math.round(RG*avail);
  const ipS=clamp(5.4+rel*.06+(s.sta-L)*.03,4.3,7.4);
  const IP=GS*ipS+RG*rnd(.95,1.15);
  if(IP<1)return {G:GS+RG,GS,IP:0,W:0,L:0,SV:0,HLD:0,K:0,HA:0,BBA:0,HRA:0,ER:0,era:0,whip:0,war:0};
  const nz=Math.sqrt(100/Math.max(IP,15));
  const era=clamp(4.3-rel*.11-(s.ctl-L)*.015+randn()*.42*nz,.8,9.5);
  const k9=clamp(7.4+(s.vel-L)*.07+(s.brk-L)*.05+(s.stf-L)*.03,3.5,15.5);
  const K=Math.round(IP*k9/9);
  const to=S.teamOff[S.team]||0;
  const dec=Math.sqrt(GS/28);
  let W=Math.max(0,Math.round(GS*(.31+(4.3-era)*.045+to*.012)+RG*rnd(.02,.06)+randn()*2.4*dec));
  let Lo=Math.max(0,Math.round(GS*clamp(.3-(4.3-era)*.035,.08,.5)+RG*rnd(.02,.05)+randn()*2*dec));
  let SV=0,HLD=0;
  if(!sp&&role==='핵심')SV=Math.max(0,Math.round(RG*clamp(.55+(3.5-era)*.06,.3,.75)+randn()*5));
  if(!sp&&role==='주전')HLD=Math.max(0,Math.round(RG*rnd(.28,.4)+randn()*4));
  const bb9=clamp(3.4-(s.ctl-L)*.06+randn()*.35,1,7);
  const whip=clamp(.6+era*.175+randn()*.05,.7,2.4);
  const BBA=Math.round(IP*bb9/9), HA=Math.max(Math.round(IP*.45),Math.round(IP*whip-BBA));
  const HRA=Math.max(0,Math.round(IP/9*clamp(1-(s.stf-L)*.02+randn()*.15,.25,2.2)));
  const ER=Math.round(era*IP/9);
  const war=(5.2-era)*IP/9/11.5+(SV>20?.5:0);
  return {G:GS+RG,GS,IP,W,L:Lo,SV,HLD,K,HA,BBA,HRA,ER,era,whip:(HA+BBA)/IP,war:+war.toFixed(1)};
}
function lineMain(r){
  const l=r.line;if(!l)return r.role==='복무'?'현역 복무 (공식 경기 없음)':'-';
  if(POS[S.pos].p){
    if(!l.IP)return '등판 없음';
    const sv=l.SV?` ${l.SV}세이브`:'',h=l.HLD?` ${l.HLD}홀드`:'';
    return `${l.W}승 ${l.L}패${sv}${h} · ERA ${f2(l.era)} · ${ipFmt(l.IP)}이닝 · ${l.K}K`;
  }
  if(l.PA<5)return `${l.G}경기 ${l.PA}타석${l.SB?` · ${l.SB}도루`:''}`;
  return `타율 ${f3(l.avg)} · ${l.HR}홈런 · ${l.RBI}타점 · ${l.SB}도루 · OPS ${f3(l.ops)}`;
}
function lineText(r){
  let t=lineMain(r);
  if(r.farm){const fr={line:r.farm,role:''};t+=` <span class="note">/ 퓨처스·마이너 ${lineMain(fr)}</span>`;}
  return t;
}
function fieldText(f){
  if(!f)return '';
  let t=`수비 ${f.inn}이닝 · 실책 ${f.E} · 수비율 ${f3(f.fpct)} · DRS ${f.drs>=0?'+':''}${f.drs}`;
  if(f.sba)t+=` · 도루저지 ${f.cs}/${f.sba} (${Math.round(f.cs/f.sba*100)}%)`;
  if(f.ast!==undefined)t+=` · 보살 ${f.ast}`;
  return t;
}
function scaleLine(l,k){
  if(!l)return l;const o={...l};
  ['G','PA','AB','H','HR','RBI','SB','GS','W','L','SV','HLD','K'].forEach(x=>{if(typeof o[x]==='number')o[x]=Math.round(o[x]*k);});
  if(typeof o.IP==='number')o.IP=o.IP*k;o.war=+(o.war*k).toFixed(1);
  if(o.field){const f={...o.field};['inn','TC','E','drs','sba','cs','ast'].forEach(x=>{if(typeof f[x]==='number')f[x]=Math.round(f[x]*k);});o.field=f;}
  return o;
}

/* ===== 리그 순위 =====
   게임의 기록 생성기로 측정한 '주전급 선수' 분포(평균, 표준편차, 높을수록 좋은가, 누적기록 여부)
   다른 선수들의 기록을 이 분포에서 뽑았다고 보고 내 순위를 계산한다 */
const LBD={avg:[.269,.034,1],obp:[.33,.038,1],slg:[.422,.075,1],ops:[.752,.108,1],HR:[16.3,8.1,1,1],RBI:[75.8,21,1,1],SB:[10.7,10.7,1,1],H:[131.4,18.7,1,1],R:[68,13.7,1,1],BB:[48,11.5,1,1],bwar:[1.6,2.16,1,1],
  era:[4.11,.8,0],whip:[1.32,.148,0],W:[9.9,2.66,1,1],K:[132.8,27.7,1,1],IP:[155,15,1,1],pwar:[1.73,1.34,1,1],SV:[22,9,1,1],HLD:[14,8,1,1]};
const LBN={KBO:{b:60,sp:22,p:40,sv:10,hld:30},NPB:{b:55,sp:20,p:36,sv:12,hld:36},MLB:{b:140,sp:45,p:90,sv:30,hld:70}};
const RK_NAME={avg:'타율',ops:'OPS',bwar:'WAR',pwar:'WAR',HR:'홈런',RBI:'타점',R:'득점',H:'안타',SB:'도루',obp:'출루율',slg:'장타율',BB:'볼넷',era:'평균자책점',W:'승',K:'탈삼진',whip:'WHIP',IP:'이닝',SV:'세이브',HLD:'홀드'};
function Phi(z){const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2);let p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p;}
function rankOf(key,x,n,lg){
  let [mu,sd,hi,cum]=LBD[key];if(cum){const k=LG[lg].G/144;mu*=k;sd*=k;}
  const q=hi?1-Phi((x-mu)/sd):Phi((x-mu)/sd);let c=0;for(let i=0;i<n;i++)if(R()<q)c++;
  let tie=false;if(cum&&Number.isInteger(x)){const pe=n*(Phi((x+.5-mu)/sd)-Phi((x-.5-mu)/sd));tie=R()<Math.min(.6,pe);}
  return {r:c+1,tie};
}
function computeRanks(rec,lg){
  const l=rec.line,n=LBN[lg],G=LG[lg].G,rk={};if(!l)return rk;
  if(!POS[S.pos].p){
    if(l.PA<100)return rk;
    ['HR','RBI','R','H','SB','BB'].forEach(k=>{if(l[k]!==undefined)rk[k]=rankOf(k,l[k],n.b,lg);});
    rk.bwar=rankOf('bwar',l.war,n.b,lg);
    if(l.PA>=Math.round(G*3.1))['avg','obp','slg','ops'].forEach(k=>rk[k]=rankOf(k,l[k],n.b,lg));
  }else{
    if(l.IP<20)return rk;
    ['W','K','IP'].forEach(k=>rk[k]=rankOf(k,l[k],n.p,lg));
    rk.pwar=rankOf('pwar',l.war,n.p,lg);
    if(l.SV>=5)rk.SV=rankOf('SV',l.SV,n.sv,lg);
    if(l.HLD>=5)rk.HLD=rankOf('HLD',l.HLD,n.hld,lg);
    if(l.IP>=G){rk.era=rankOf('era',l.era,n.sp,lg);if(l.whip)rk.whip=rankOf('whip',l.whip,n.sp,lg);}
  }
  return rk;
}
function award(rec,name){rec.awards.push(name);S.awards.push({y:rec.year,n:name});}

function checkAwards(rec,lg){
  const l=rec.line,p=POS[S.pos].p,sp=S.pos==='SP',war=l.war,s=LG[lg].s;
  const qualB=!p&&l.PA>=400, qualSP=sp&&l.IP>=130, qualRP=!sp&&p&&l.IP>=45;
  const qualRook=p?(sp?l.IP>=70:l.IP>=40):l.PA>=250;
  if(!S.rookie[lg]&&qualRook){S.rookie[lg]=1;if(war>rnd(1.5,3.4))award(rec,`${s} 신인왕`);}
  const rk=rec.ranks=computeRanks(rec,lg),one=k=>rk[k]&&rk[k].r===1&&!rk[k].tie;
  const wr=rk.bwar||rk.pwar;
  if(wr&&war>=4.5&&R()<(wr.r===1?(p?.35:.6):wr.r===2?(p?.06:.12):wr.r===3?.03:0))award(rec,`${s} MVP`);
  if(!p){
    if(qualB&&war>rnd(3,5))award(rec,lg==='KBO'?'골든글러브':lg==='NPB'?'NPB 베스트나인':'실버슬러거');
    const f=l.field;
    if(f&&f.inn>=750){
      const cOk=S.pos==='C'&&f.sba&&f.cs/f.sba>=.36&&f.drs>3;
      if(f.drs>rnd(8,14)||cOk)award(rec,{KBO:'KBO 수비상',NPB:'NPB 골든글러브',MLB:'골드글러브'}[lg]);
    }
    [['avg','타격왕'],['HR','홈런왕'],['RBI','타점왕'],['SB','도루왕'],['R','득점왕'],['H','최다안타왕'],['obp','출루율상'],['slg','장타율상']].forEach(([k,n])=>{if(one(k))award(rec,`${s} ${n}`);});
  }else{
    if(sp&&qualSP&&rk.pwar&&war>=4&&R()<(rk.pwar.r===1?.8:rk.pwar.r===2?.2:0))award(rec,{KBO:'최동원상',NPB:'사와무라상',MLB:'사이영상'}[lg]);
    if(lg==='KBO'&&(qualSP||qualRP)&&war>rnd(4.6,6.6))award(rec,'골든글러브');
    [['W','다승왕'],['era','평균자책점왕'],['K','탈삼진왕'],['SV','세이브왕'],['HLD','홀드왕']].forEach(([k,n])=>{if(one(k))award(rec,`${s} ${n}`);});
  }
  if(lg!=='NPB'&&war>rnd(2.6,3.8))award(rec,`${s} 올스타`);
}

function playSeason(){
  const ov0=ovr(),yr=S.year,age=S.age;
  const rec={year:yr,age,team:S.team,lg:S.lg,playLg:S.lg,ovr:ov0,awards:[],notes:[],role:'',line:null};
  let pf=0,majorInj=false,war=0;
  if(S.lg==='ARMY'){
    rec.role='복무';pf=0;
  }else{
    let role,playLg=S.lg,pt;
    if(S.lg==='MIL'){role=ov0>=LG.MIL.L-3?'주전':'로테이션';pt=PT[role];}
    else{
      role=roleFor(ov0,S.lg,S.team);pt=PT[role];
      if(role==='2군'){playLg=LG[S.lg].farm;const d=ov0-LG[playLg].L;pt=d>=-3?.9:d>=-8?.5:.25;}
    }
    // 부상
    let avail=1;
    let inj=(.1+(S.body==='power'?.03:0)+(age>=32?.03:0))*S.injuryK*(S.training==='rest'?.5:1);
    // 체력이 바닥나면(25 미만) 몸이 버티지 못하고 시즌 아웃. 체력 35 미만은 부상 위험 증가.
    const STA=S.stats.sta;
    if(STA!==undefined&&STA<35)inj+=(35-STA)*.015;
    if(STA!==undefined&&STA<25){
      majorInj=true;avail=0;S.stats.sta=Math.min(99,STA+rnd(6,10));
      rec.notes.push('장기 부상 (체력 저하로 시즌 아웃)');news(`💥 ${S.name}, 체력 고갈 끝에 부상…시즌 아웃.`);
    }else if(R()<inj){
      if(R()<.15){majorInj=true;avail=rnd(0,.4);const ks=keys().filter(k=>PHYS[k]);ks.forEach(k=>S.stats[k]=Math.max(20,S.stats[k]-rnd(1.5,4)));rec.notes.push('장기 부상 (시즌 대부분 결장, 능력치 영구 하락)');news(`💥 ${S.name}, 큰 부상으로 장기 재활. 복귀 후에도 후유증 우려.`);}
      else{avail=rnd(.6,.85);rec.notes.push('부상으로 일부 결장');}
    }
    if(S.returnHalf){avail*=.5;rec.notes.push('시즌 중반 전역 후 합류');S.returnHalf=false;}
    const sideRole=playLg!==S.lg&&S.lg!=='MIL'?(pt>=.9?'주전':pt>=.5?'로테이션':'백업'):role;
    const sim=(lg,rl,p,a)=>POS[S.pos].p?simPit(lg,rl,p,a):simBat(lg,p,a,rl);
    rec.line=sim(playLg,sideRole,pt,avail);
    rec.role=role;rec.playLg=playLg;
    pf={핵심:1,주전:1,로테이션:.85,백업:.6,벤치:.55,대주자:.65,대수비:.65,'2군':pt>=.9?.8:.65}[role];
    // 2군에서 맹활약하면 시즌 중 콜업
    if(role==='2군'){
      const ri=roleInfo(ov0,S.lg,S.team),ps=perfScore({line:rec.line});
      if(ps>=1.1&&ri.d-ri.perf+ps>=-13&&avail>.5&&R()<.9){
        const sh=rnd(.25,.45);rec.farm=scaleLine(rec.line,1-sh);
        rec.line=sim(S.lg,'백업',POS[S.pos].p?.25:.3,avail*sh);
        rec.role='콜업';rec.playLg=S.lg;pf=.8;
        rec.notes.push(`퓨처스 맹활약으로 ${pick(['6월','7월','8월'])} 1군 콜업`);news(`📞 ${S.name}, 2군 성적을 앞세워 1군 콜업!`);
      }
    }
    // 1군에서 크게 부진하면 시즌 중 강등
    else if(topLg(playLg)&&['주전','로테이션','백업'].includes(role)){
      const l=rec.line,bad=POS[S.pos].p?(l.IP>=30&&l.era>6.8):(l.PA>=150&&(l.ops<.56||l.avg<.19));
      if(bad&&R()<.6){
        const sh=rnd(.35,.55),farm=LG[S.lg].farm;
        rec.line=scaleLine(l,1-sh);rec.farm=sim(farm,'주전',.8,avail*sh);rec.role='강등';pf=.7;
        rec.notes.push('부진으로 시즌 중 2군 강등');news(`⬇️ ${S.name}, 부진 끝에 2군행 통보.`);
      }
    }
    war=rec.line.war;
    if(S.lg==='MIL')pf=.85;
    if(avail<.5)pf*=.6;
    // 수상
    if(topLg(playLg)&&playLg===S.lg)checkAwards(rec,playLg);
    // 팀 성적
    const to=S.teamOff[S.team]||0;
    const sc=to+war*.25+randn()*2.2;
    if(topLg(S.lg)){
      // 정규시즌 순위: KBO 10팀, NPB 리그별 6팀, MLB 리그별 15팀. 가을야구는 KBO 5위·NPB 3위·MLB 6위까지
      const NT={KBO:10,NPB:6,MLB:15}[S.lg],PSN={KBO:5,NPB:3,MLB:6}[S.lg];
      const rk=clamp(1+Math.round((1-Phi(sc/2.6))*(NT-1)),1,NT);rec.team_rank=rk;
      const champP={KBO:[.5,.2,.12,.05,.03],NPB:[.3,.12,.05],MLB:[.15,.12,.1,.07,.05,.04]}[S.lg][rk-1]||0;
      if(playLg===S.lg){
        if(R()<champP){award(rec,`${LG[S.lg].ps} 우승`);rec.team_r='우승';}
        else rec.team_r=rk<=PSN?'포스트시즌':'탈락';
      }else rec.team_r='2군';
    }else if(S.lg==='HS'){
      if(sc>3.2&&rec.role!=='벤치'){award(rec,`${pick(HS_TOURN)} 우승`);}
      const hl=rec.line,dom=POS[S.pos].p?(hl.IP>=20&&hl.era<=2.5):(hl.PA>=50&&hl.avg>=.4&&hl.ops>=1.05);
      if(age>=17&&ov0>=(age>=18?51:48)&&dom){award(rec,'U-18 청소년 대표');}
    }else if(S.lg==='UNIV'&&sc>3.5){award(rec,'대학야구 U-리그 우승');}
  }
  // 국가대표
  if(S.natYear===yr&&S.lg!=='ARMY'){
    const t=tourneyOf(yr),c=(ov0-66)*.012;S.caps++;
    let res;
    if(t==='아시안게임'){res=R()<.66+c?'금메달':R()<.6?'은메달':'동메달';}
    else if(t==='올림픽'){const x=R();res=x<.18+c?'금메달':x<.4+c?'은메달':x<.62+c?'동메달':'노메달';}
    else if(t==='WBC'){const x=R();res=x<.07+c?'우승':x<.17+c?'준우승':x<.4?'8강':'1라운드 탈락';}
    else {const x=R();res=x<.25+c?'우승':x<.5?'준우승':'슈퍼라운드';}
    rec.notes.push(`${t} 국가대표: ${res}`);
    if(['금메달','우승'].includes(res))award(rec,`${t} ${res}`);
    else if(res.includes('메달')&&res!=='노메달')award(rec,`${t} ${res}`);
    news(`🇰🇷 ${t} 대표팀 결과: ${res}`);
    if(S.mil==='none'&&((t==='아시안게임'&&res==='금메달')||(t==='올림픽'&&res!=='노메달'))){S.mil='exempt';news(`🎖️ ${t} ${res}로 병역 특례(예술체육요원) 대상이 됐다!`);rec.notes.push('병역 특례 획득');}
  }
  // 명성
  const big=rec.awards.filter(a=>/MVP|사이영|최동원|사와무라/.test(a)).length;
  S.fame=clamp(S.fame*.95+(topLg(rec.playLg)?Math.max(0,war)*1.4:Math.max(0,war)*.4)+rec.awards.length*2.5+big*8,0,100);
  // 성장
  growth(age,pf,war,majorInj);
  // 수입
  rec.pay=Math.round(seasonPay(rec));S.earned=(S.earned||0)+rec.pay;
  // 계약/서비스
  if(S.lg==='KBO'&&rec.playLg==='KBO'&&rec.role!=='콜업')S.svc.kbo++; // FA 연차는 1군 등록 시즌만 인정
  if(S.lg==='MLB'&&rec.playLg==='MLB')S.svc.mlb++;
  if(S.lg==='NPB')S.svc.npb++;
  if(S.con&&S.con.type==='fa')S.con.years--;
  if(['HS','UNIV','INDIE'].includes(S.lg))S.amYears++;
  if(S.lg==='UNIV')S.uniYears++;
  rec.after=ovr();S.peak=Math.max(S.peak,rec.after);
  S.seasons.push(rec);
  // 뉴스
  const lgName=LG[rec.playLg].s;

  // 전역 처리
  let discharged=false;
  if(S.lg==='MIL'||S.lg==='ARMY'){
    S.mil='done';discharged=true;const mi=S.milInfo;
    if(mi&&mi.team){S.team=mi.team;S.lg='KBO';S.con=mi.con;S.returnHalf=true;news(`🪖 전역. 원소속팀 ${S.team}에 복귀한다.`);}
    else{S.lg='KBO';S.team='(무소속)';S.con={type:'fa',years:0,sal:0,cur:'KRW'};S.returnHalf=true;S.needFA='return';news('🪖 전역. 새 소속팀을 찾아야 한다.');}
    S.milInfo=null;
  }
  S.year++;S.age++;S.lastRec=rec;
  const sal0=S.con?salFmt(S.con):'',team0=S.team,sal0n=S.con?toKRW(S.con.sal,S.con.cur):0;
  genOffseason();
  if(S.con&&S.team===team0&&salFmt(S.con)!==sal0&&sal0){rec.salChange=`${sal0} → ${salFmt(S.con)}`;if(sal0n>0)rec.salPct=Math.round((toKRW(S.con.sal,S.con.cur)/sal0n-1)*100);}
  headlines(rec).forEach(t=>S.news.unshift({y:rec.year,t,h:1}));
  save();
  showSeasonModal(rec,ov0);
}

function growth(age,pf,war,majorInj){
  let g;
  if(age<=18)g=3.8;else if(age<=21)g=3.2;else if(age<=24)g=2.5;else if(age<=26)g=1.5;else if(age<=28)g=.6;else if(age<=30)g=-.2;
  else g=-(.9+(age-31)*.55+Math.max(0,age-34)*.45)*S.aging*rnd(.6,1.4)-(R()<.1?rnd(2,4):0);
  const o=ovr();
  if(S.lg==='ARMY'){g=-1.1;}
  else if(g>0){
    const gap=S.pot-o;const potF=gap<=0?0:S.lg==='HS'?clamp(gap/12,.3,1):clamp(gap/10,.12,1.15);
    let tf=1;
    if(S.trait==='early')tf=age<22?1.3:age>=25?.7:1;
    if(S.trait==='late')tf=age<24?.8:1.1;
    g=g*pf*potF*tf*rnd(.55,1.3);
    if(S.lg!=='HS')g+=clamp(war*.08,-.3,.5)*potF;
    g=Math.min(g,Math.max(0,S.pot-o+.5));
    if(S.training==='rest')g*=.85;
    if(majorInj)g*=.5;
  }else{
    if(S.training==='rest')g*=.8;
  }
  // 대기만성
  if(S.trait==='late'&&age>=26&&age<=28&&!S.bloomed&&pf>=.85){S.bloomed=true;S.pot+=rint(6,10);g+=1.5;news(`🌱 ${S.name}, 뒤늦게 눈을 떴다! 코치진 "지금부터가 진짜"`);}
  distribute(g);
}
function distribute(g){
  const ks=keys(),w=POS[S.pos].w,mw=ks.reduce((a,k)=>a+w[k],0)/6,sw=ks.reduce((a,k)=>a+w[k],0);
  const r={};
  ks.forEach(k=>{
    if(g>=0)r[k]=(w[k]/mw)*.7+.3+(S.training===k?1.3:0)+(S.training==='bal'?.1:0);
    else r[k]=PHYS[k]?1.6:(k==='men'||k==='eye')?.2:.6;
    r[k]*=rnd(.7,1.3);
  });
  const c=sw/ks.reduce((a,k)=>a+w[k]*r[k],0);
  ks.forEach(k=>{S.stats[k]=clamp(S.stats[k]+g*c*r[k],15,99);});
}

/* ================= 오프시즌 이벤트 ================= */
function genOffseason(){
  rollNeeds();
  const q=S.queue;const o=ovr(),age=S.age;
  // 은퇴 강제
  if(age>=45){q.push({k:'END',title:'은퇴의 시간',desc:'몸이 더는 따라주지 않는다. 유니폼을 벗을 때가 왔다.',choices:[{label:'은퇴 선언',sub:'커리어를 마무리한다',act:'retire'}]});return;}
  // 아마추어 진로
  if(S.lg==='HS'&&S.amYears>=3){q.push(evDraft());}
  else if(S.lg==='UNIV'&&S.uniYears>=4){q.push(evDraft());}
  else if(S.lg==='INDIE'){
    if(S.age<=27)q.push(evDraft());
    else q.push({k:'INDIE',title:'독립리그의 겨울',desc:'드래프트 나이를 넘겼다. 프로 구단의 연락은 이제 FA 테스트뿐이다.',choices:[...(ovr()>=LG.KBO.L-6&&S.age<=34?[mkOffer(pick(T.KBO),'KBO',1,'입단 테스트 합격')]:[]),...(S.age<=38?[{label:'독립리그에서 1년 더',sub:'야구를 계속한다',act:'stay'}]:[]),{label:'은퇴',sub:'유니폼을 벗는다',act:'retire'}]});
  }
  // 전역 후 FA
  if(S.needFA){q.push(evFA(S.needFA));S.needFA=null;}
  // 병역
  const pro=isPro();
  if(pro&&S.mil==='none'){
    if(age>=28){q.push(evMil(true));}
    else if(age>=22&&(age>=25||R()<.45)){q.push(evMil(false));}
  }
  // 계약
  let faNow=false;
  if(pro&&!q.some(e=>e.k==='MIL'&&e.forced)){
    const c=S.con;
    if(c.type==='reserve'&&S.lg==='KBO'){
      const need=S.college?7:8;
      if(S.svc.kbo>=need){faNow=true;q.push(evFA('FA'));}
      else{
        const lr=S.lastRec;const tg=kboPreTarget(lr)*(needHit(S.team,'KBO')?1.1:1);
        let ns=tg>c.sal?c.sal+(tg-c.sal)*.85:Math.max(c.sal*.75,tg);
        ns=Math.max(kboMin(),Math.round(ns/100)*100);
        if(ns!==c.sal)c.sal=ns;
        if(S.svc.kbo>=7&&o>=72&&S.postYear!==S.year)q.push(evPosting());
        if(lr&&lr.role==='2군'&&age>=29&&o<LG.FUT.L+3&&!faNow){faNow=true;news(`✂️ ${S.team}, ${S.name} 방출.`);q.push(evFA('release'));}
      }
    }else if(c.type==='reserve'&&S.lg==='MLB'){
      const lr=S.lastRec;
      if(S.svc.mlb>=6){faNow=true;q.push(evFA('FA'));}
      else if(lr&&lr.role==='2군'&&age>=26&&o<LG.AAA.L+2){faNow=true;news(`✂️ ${S.team}, ${S.name} 방출.`);q.push(evFA('release'));}
      else{const arb={3:.3,4:.45,5:.6}[S.svc.mlb];const ns=arb?Math.max(MLB_MIN,mlbFA(o,age)*arb):MLB_MIN;
        c.sal=+ns.toFixed(2);}
    }else if(c.type==='fa'&&c.years<=0){faNow=true;q.push(evFA('FA'));}
    else if(c.type==='fa'&&S.lastRec&&S.lastRec.role==='2군'&&age>=33&&R()<.5){faNow=true;news(`✂️ ${S.team}, 잔여 계약을 정리하고 ${S.name} 방출.`);q.push(evFA('release'));}
  }
  // 트레이드 제안
  if(pro&&!faNow&&S.lastRec&&['백업','2군','대주자','대수비','강등'].includes(S.lastRec.role)&&o>=LG[S.lg].L-10&&R()<.35){
    const ev=evTrade('구단 간 트레이드 제안이 들어왔다.');if(ev)q.push(ev);
  }

  }
  // 코치 제안
  if(age>=19&&age<=31&&S.coachN<2&&S.lg!=='ARMY'&&R()<.2)q.push({k:'COACH',title:'육성 방향 전환점',desc:'코치가 면담을 요청했다.\n"앞으로 집중해서 키우고 싶은 능력 두 가지를 골라 봐. 확실히 끌어올려 줄게."',coach:1});
  // 기자회견
  if(pro&&S.year-S.lastPress>=3&&S.fame>=12&&R()<.6)q.push(evPress());
  // 주장
  if(topLg(S.lg)&&age>=28&&S.fame>=30&&S.year-S.teamSince>=4&&!S.captainOf.includes(S.team)&&R()<.3)
    q.push({k:'CAP',title:'주장 제안',desc:`${S.team} 감독이 다음 시즌 주장을 맡아 달라고 한다.`,choices:[{label:'주장 완장을 찬다',sub:'명성 +',act:'captain'},{label:'사양한다',sub:'플레이에만 집중',act:'stay'}]});
}
function natPick(t){ // 직전 시즌 성적으로 대표팀 선발 여부 판단. 뽑히면 근거 문장을 돌려준다
  const r=S.lastRec,age=S.age;if(!r||!r.line)return null;
  const l=r.line,p=POS[S.pos].p,sp=S.pos==='SP',top=topLg(r.playLg);
  const lgMul={KBO:1,NPB:1.25,MLB:1.7,FUT:.45,MIL:.45}[r.playLg];if(!lgMul)return null;
  if(!top&&!(t==='아시안게임'&&age<=25))return null; // 2군 선수는 아시안게임 젊은 선수 몫만 가능
  const posAdj={C:-1.2,SS:-.5,CF:-.3,'2B':-.2,'3B':0,LF:.2,RF:.2,'1B':.4,DH:.8,SP:0,RP:-.3}[S.pos]||0;
  let req={WBC:4,'올림픽':3,'프리미어12':2.5,'아시안게임':2}[t]+posAdj;
  if(t==='아시안게임')req+=age<=25?-.8:1.5;

/* ===== 자동 결정: 무난하고 현실적인 쪽을 고른다 ===== */
function autoScore(c,ev){
  const o=ovr();
  switch(c.act){
    case 'retire':return S.age>=41?500:S.age>=38?15:-1000;
    case 'draftKBO':return 80+(c.data.b||0)*5-(c.data.dev?30:0);
    case 'draftMLB':return 70+(c.data.b||0)*3;
    case 'college':return 40;
    case 'indie':return 10;
    case 'stay':return ev&&ev.k==='MIL'?(S.age<25?35:5):20;
    case 'sign':{const r=roleFor(o,c.data.lg,c.data.team);const rs=({핵심:5,주전:4,로테이션:2,백업:0,대주자:0,대수비:0,'2군':-3})[r]??0;const sal=toKRW(c.data.con.sal,c.data.con.cur);return 50+rs*6+Math.log10(Math.max(1,sal))*4+(c.data.lg==='MLB'&&rs>=2?6:0)+(c.hit?3:0);}
    case 'trade':return /핵심|주전|에이스|마무리|필승조|선발 로테이션/.test(c.sub||'')?40:15;
    case 'posting':return o>=72?45:10;
    case 'sangmu':return c.data.p>=.45?60:30;
    case 'army':return 25;
    case 'natYes':return 90;case 'natNo':return 0;
    case 'press':return c.data.p*100;
    case 'captain':return 80;
    default:return 0;
  }
}
function autoResolve(all){
  const log=[];
  while(S.queue.length&&!S.retired){
    const ev=S.queue[0];
    if(ev.coach){const w=POS[S.pos].w;UI.coachSel=keys().slice().sort((a,b)=>w[b]-w[a]).slice(0,2);log.push(`${ev.title}: ${UI.coachSel.map(k=>SN[k]).join('·')}`);coachConfirm(true);}
    else{let bi=0,bs=-1e9;ev.choices.forEach((c,i)=>{const v=autoScore(c,ev);if(v>bs){bs=v;bi=i;}});
      const c=ev.choices[bi];log.push(`${ev.title}: ${c.label}`);S.queue.shift();try{ACT[c.act](c.data||{});}catch(e){console.error(e);}}
    if(!all)break;
  }
  save();render();
  if(log.length)toast(log.length===1?`자동 결정 · ${log[0]}`:`자동 결정 ${log.length}건 · ${log.slice(0,2).join(' / ')}${log.length>2?' …':''}`);
}
/* ===== 자동 진행: 결정·시즌 진행을 멈출 때까지 알아서 ===== */
function startAuto(){UI.autoplay=true;autoBar();render();clearTimeout(UI.autoT);UI.autoT=setTimeout(autoTick,250);}
function stopAuto(){UI.autoplay=false;UI.autoTr=null;clearTimeout(UI.autoT);autoBar();if(S)render();}
function autoBar(){let b=document.getElementById('autobar');
  if(!UI.autoplay){if(b)b.remove();return;}
  if(!b){b=document.createElement('div');b.id='autobar';b.className='autobar';b.innerHTML=`<span><i class="dot"></i>자동 진행 중</span><button class="btn" data-autostop>멈추기</button>`;document.body.appendChild(b);b.querySelector('[data-autostop]').onclick=stopAuto;}}
function autoTick(){
  if(!UI.autoplay)return;
  if(!S||S.retired){stopAuto();return;}
  const lay=document.getElementById('layer');
  if(lay&&lay.innerHTML.trim()){UI.autoT=setTimeout(autoTick,300);return;} // 시즌 팝업이 닫힐 때까지 대기(클릭해서 멈추면 같이 멈춤)
  if(S.queue.length){autoResolve(false);if(S.retired){stopAuto();return;}UI.autoT=setTimeout(autoTick,900);return;}
  // 1) 훈련 방향 자동 선택 → 칩 색이 바뀌는 걸 보여주고  2) 시즌 진행 버튼이 눌리듯 어두워진 뒤  3) 시즌 진행
  S.training=autoTraining();UI.autoTr=S.training;save();render();
  UI.autoT=setTimeout(()=>{
    if(!UI.autoplay)return;
    const b=document.querySelector('[data-play]');if(b)b.classList.add('autopress');
    UI.autoT=setTimeout(()=>{
      if(!UI.autoplay)return;
      UI.autoTr=null;playSeason();
      if(S.retired){stopAuto();return;}
      UI.autoT=setTimeout(autoTick,500);
    },700);
  },1100);
}
function autoTraining(){
  const ks=keys(),w=POS[S.pos].w;
  if(S.age>=33&&R()<.35)return 'rest';
  if(R()<.15)return 'bal';
  let best=ks[0],bv=-1;ks.forEach(k=>{const v=(w[k]||.5)*(99-S.stats[k])*(0.8+R()*.4);if(v>bv){bv=v;best=k;}});
  return best;
}
function coachConfirm(silent){
  const sel=UI.coachSel||[];if(sel.length!==2)return;
  S.queue.shift();S.coachN++;
  sel.forEach(k=>S.stats[k]=Math.min(99,S.stats[k]+rnd(2,3.5)));UI.coachSel=[];
  news(`🧢 코치와 함께 ${sel.map(k=>SN[k]).join('·')} 집중 육성에 들어갔다.`);
  if(silent===true)return;
  save();render();
}
function requestTrade(){
  S.reqYear=S.year;S.fame=Math.max(0,S.fame-2);
  const ev=evTrade('이적을 요청하자 몇몇 구단이 관심을 보였다.');
  if(ev)S.queue.unshift(ev);else news('이적을 요청했지만 관심을 보이는 구단이 없었다.');

}

function careerTotals(){
  const by={};
  S.seasons.forEach(r=>{
    if(!r.line||!topLg(r.playLg))return;
    const t=by[r.playLg]||(by[r.playLg]={seasons:0,G:0,PA:0,AB:0,H:0,HR:0,RBI:0,SB:0,IP:0,W:0,L:0,SV:0,K:0,ER:0,war:0});
    const l=r.line;t.seasons++;t.war+=l.war;t.G+=l.G||0;
    if(POS[S.pos].p){t.IP+=l.IP;t.W+=l.W;t.L+=l.L;t.SV+=l.SV;t.K+=l.K;t.ER+=l.era*l.IP/9;}
    else{t.PA+=l.PA;t.AB+=l.AB;t.H+=l.H;t.HR+=l.HR;t.RBI+=l.RBI;t.SB+=l.SB;}
  });
  return by;
}
function totText(t){
  if(POS[S.pos].p)return `${t.seasons}시즌 · ${t.W}승 ${t.L}패 ${t.SV}세이브 · ERA ${f2(t.IP?t.ER*9/t.IP:0)} · ${Math.round(t.IP)}이닝 · ${t.K}K · WAR ${t.war.toFixed(1)}`;
  return `${t.seasons}시즌 · 타율 ${f3(t.AB?t.H/t.AB:0)} · ${t.H}안타 ${t.HR}홈런 ${t.RBI}타점 ${t.SB}도루 · WAR ${t.war.toFixed(1)}`;
}
function cnt(re){return S.awards.filter(a=>re.test(a.n)).length;}
function doRetire(){
  const tot=careerTotals();const war=Object.values(tot).reduce((a,t)=>a+t.war,0);
  const mvp=cnt(/MVP/),cy=cnt(/사이영|최동원|사와무라/),gg=cnt(/골든글러브|실버슬러거|베스트나인|골드글러브|수비상/),champ=cnt(/시리즈 우승/),intl=cnt(/금메달|WBC 우승|프리미어12 우승/),ttl=cnt(/왕$/),rook=cnt(/신인왕/);
  const score=war+mvp*6+cy*4+gg*1.5+ttl+champ*2+intl*2+rook;
  let tier,head;
  const mlbW=tot.MLB?tot.MLB.war:0;
  if(score>=110){tier='전설';head=`"한국 야구가 낳은 최고의 선수" ${S.name}, 화려했던 ${S.seasons.length}년을 마치고 은퇴`;}
  else if(score>=75){tier='명예의 전당';head=`${S.name}, 명예의 전당 헌액 확실시… MVP ${mvp}회의 레전드가 떠난다`;}
  else if(score>=45){tier='레전드';head=`팬들의 기립박수 속에 ${S.name} 은퇴식… "${S.team}의 영원한 ${POS[S.pos].n}"`;}
  else if(score>=20){tier='베테랑';head=`꾸준함의 아이콘 ${S.name}, 정든 그라운드와 작별`;}
  else if(score>=3){tier='저니맨';head=`여러 팀을 오가며 버틴 ${S.name}, 조용히 유니폼을 벗다`;}
  else{tier='꿈을 좇은 선수';head=`프로의 벽은 높았다… ${S.name}, 새로운 인생을 향해`;}
  if(mlbW>=40)head=`메이저리그를 정복한 ${S.name}, 쿠퍼스타운을 바라보며 은퇴`;
  const after=score>=75?pick(['친정팀 감독으로 돌아올 날만 남았다.','방송 해설위원으로 새 출발한다.','국가대표 코치진 합류가 유력하다.']):score>=20?pick(['고향 고교 야구부 코치로 부임했다.','야구 아카데미를 열었다.','구단 프런트에 합류했다.','야구 유튜브 채널을 시작했다.']):pick(['사회인 야구 리그에서 여전히 공을 던진다.','유소년 야구교실 코치가 됐다.','회사원으로 새 삶을 시작했다.','동네 배팅센터를 차렸다.']);
  S.retired=true;
  S.end={tier,head,after,score:+score.toFixed(1),war:+war.toFixed(1),mvp,ttlAwards:S.awards.length,peak:S.peak,tot};
  news(`👋 ${head}`);
  // 로컬 랭킹
  if(S.seasons.some(r=>topLg(r.playLg))){
    try{
      const arr=JSON.parse(renameTeams(localStorage.getItem(RANK_KEY))||'[]');
      arr.push({name:S.name,pos:S.pos,mvp,peak:S.peak,awards:S.awards.length,war:+war.toFixed(1),score:+score.toFixed(1),tier,team:S.team,yrs:S.seasons.length,date:new Date().toISOString().slice(0,10)});
      localStorage.setItem(RANK_KEY,JSON.stringify(arr.slice(-200)));
    }catch(e){}
  }
  save();render();
}
function rankList(){
  let arr=[];try{arr=JSON.parse(renameTeams(localStorage.getItem(RANK_KEY))||'[]');}catch(e){}
  return arr.sort((a,b)=>b.mvp-a.mvp||b.peak-a.peak||b.awards-a.awards||b.war-a.war);
}

const f1=v=>(+v).toFixed(1);
const BATC=[['avg','타율',f3,'avg'],['G','경기'],['PA','타석'],['AB','타수'],['H','안타',0,'H'],['D2','2루타'],['D3','3루타'],['HR','홈런',0,'HR'],['RBI','타점',0,'RBI'],['R','득점',0,'R'],['SB','도루',0,'SB'],['BB','볼넷',0,'BB'],['SO','삼진'],['obp','출루율',f3,'obp'],['slg','장타율',f3,'slg'],['ops','OPS',f3,'ops'],['war','WAR',f1,'bwar']];
const PITC=[['G','경기'],['GS','선발'],['W','승',0,'W'],['L','패'],['SV','세이브',0,'SV'],['HLD','홀드',0,'HLD'],['IP','이닝',ipFmt,'IP'],['HA','피안타'],['HRA','피홈런'],['BBA','볼넷'],['K','탈삼진',0,'K'],['era','평균자책점',f2,'era'],['whip','WHIP',f2,'whip'],['war','WAR',f1,'pwar']];
function statRows(){
  const rows=[];
  S.seasons.forEach(r=>{
    if(r.line&&(r.line.PA||r.line.IP||r.line.G))rows.push({y:r.year,team:r.team,lg:r.playLg,l:r.line,rk:r.ranks||{}});
    if(r.farm)rows.push({y:r.year,team:r.team,lg:LG[r.lg].farm||r.lg,l:r.farm,rk:{}});
  });
  return rows;
}
function sumRows(rs){
  const p=POS[S.pos].p,t={};const has=k=>rs.every(r=>r.l[k]!==undefined);
  const cols=p?PITC:BATC;cols.forEach(([k])=>{t[k]=rs.reduce((a,r)=>a+(+r.l[k]||0),0);});
  t.war=+t.war.toFixed(1);
  if(p){const ip=t.IP||0;t.era=ip?rs.reduce((a,r)=>a+(r.l.era||0)*(r.l.IP||0),0)/ip:0;t.whip=ip?rs.reduce((a,r)=>a+(r.l.whip||0)*(r.l.IP||0),0)/ip:0;if(!has('whip'))t.whip=null;['HA','HRA','BBA'].forEach(k=>{if(!has(k))t[k]=null;});}
  else{const pa=t.PA||0,ab=t.AB||0;t.avg=ab?t.H/ab:0;t.obp=pa?rs.reduce((a,r)=>a+(r.l.obp||0)*(r.l.PA||0),0)/pa:0;t.slg=ab?rs.reduce((a,r)=>a+(r.l.slg||0)*(r.l.AB||0),0)/ab:0;t.ops=t.obp+t.slg;['D2','D3','R','BB','SO'].forEach(k=>{if(!has(k))t[k]=null;});}
  return t;
}
function cellv(v,fmt){if(v===undefined||v===null||Number.isNaN(v))return '-';return fmt?fmt(v):Math.round(v).toLocaleString();}
function statsView(){

  const body=rows.slice().reverse().map(r=>{const farm=!topLg(r.lg);return `<tr class="${farm?'farm':''}"><td>${r.y}</td><td class="tm">${esc(r.team)} <span class="lgtag lg-${r.lg}">${LG[r.lg].s}</span></td>${cols.map(c=>{const rk=c[3]&&r.rk[c[3]];return `<td class="${rk&&rk.r===1&&!rk.tie?'lead':''}">${cellv(r.l[c[0]],c[2])}</td>`;}).join('')}</tr>`;}).join('');
  let html=`<div class="subh"><h3>${p?'투구':'타격'} 기록</h3><span class="note">빨간 숫자 = 리그 1위 · 회색 줄 = 2군·아마추어</span></div><div class="stwrap"><table class="stbl">${head}${tot}${body}</table></div>`;
  if(!p&&S.pos!=='DH'){

      const fv=f=>({...f,csp:f.sba?f.cs/f.sba:null});
      const ft=lg=>{const rs=fr.filter(r=>r.lg===lg).map(r=>fv(r.l.field));if(!rs.length)return '';const t={};['inn','TC','E','drs','sba','cs','ast'].forEach(k=>t[k]=rs.reduce((a,f)=>a+(f[k]||0),0));t.fpct=t.TC?(t.TC-t.E)/t.TC:1;t.csp=t.sba?t.cs/t.sba:null;return `<tr class="tot"><td>${LG[lg].s} 통산</td><td class="tm">${POS[S.pos].n}</td>${fc.map(x=>`<td>${cellv(t[x[0]],x[2])}</td>`).join('')}</tr>`;};

    }

    <div class="split">
      <div class="field"><label>이름</label><input type="text" id="fname" maxlength="12" placeholder="예: 홍길동" value="${esc(CF.name)}"></div>
      <div class="field"><label>고등학교</label><select id="fhs">${T.HS.map(h=>`<option ${h===CF.hs?'selected':''}>${h}</option>`).join('')}</select></div>
      <div class="field"><label>포지션</label><select id="fpos">${Object.entries(POS).map(([k,v])=>`<option value="${k}" ${k===CF.pos?'selected':''}>${v.n}</option>`).join('')}</select></div>
      <div class="field"><label>투타</label><select id="fhand">${['우투우타','우투좌타','좌투좌타','좌투우타'].map(h=>`<option ${h===CF.hand?'selected':''}>${h}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>체형</label><div class="chips">${[['slim','슬림 (주루·제구↑ 파워↓)'],['std','표준'],['power','파워 (파워·구속↑, 부상 위험↑)']].map(([k,n])=>`<button class="chip ${CF.body===k?'on':''}" data-body="${k}">${n}</button>`).join('')}</div></div>
    <div class="split">
      <div class="field"><label>등번호 (0~99)</label><input type="number" id="fnum" min="0" max="99" value="${CF.num}"></div>
      <div class="field"><label>&nbsp;</label><p class="note" style="margin:6px 0 0">키·몸무게는 후보마다 체형에 맞게 무작위로 정해져요. 무거울수록 파워·구위, 가벼울수록 주루가 좋고, 키가 크면 투수는 구속·타자는 파워와 어깨가 조금 올라가요.</p></div>
    </div>
    ${bad?'<p class="note" style="color:var(--red)">좌투는 포수·2루수·3루수·유격수를 맡기 어려워요. 포지션이나 투타를 바꿔 주세요.</p>':''}
    <p class="note">국적: 대한민국 (병역 의무 적용)</p>
    <button class="btn primary" id="fgo" ${bad?'disabled':''}>선수 3명 보기</button>
  </div>
  ${CANDS?`<div class="card"><h2>선수를 골라 주세요</h2><p class="note">세 선수 모두 종합 45, 능력치 평균 45에서 시작해요. 잠재력·성장 유형·노화 속도는 숨겨져 있고, 잠재력 평가는 스카우트의 짐작이라 참고용일 뿐이에요.</p>
  <div class="cands">${CANDS.map((c,i)=>`<div class="cand"><div class="chead"><div class="cav">${avatarSVG({look:c.look,team:CF.hs,body:CF.body,age:16,pitcher:POS[CF.pos].p,name:'선수 '+'ABC'[i]})}</div><div><h4>선수 ${'ABC'[i]}</h4><div class="note">종합 ${ovrOf(c.stats,CF.pos)} · 잠재력 평가 ${grade(c.potGuess)} · ${c.h}cm ${c.w}kg</div></div></div>
    ${(POS[CF.pos].p?PIT:BAT).map(k=>`<div class="stat"><span>${SN[k]}</span><div class="bar"><i style="width:${c.stats[k]}%"></i></div><span class="num">${c.stats[k]}</span></div>`).join('')}
    <p class="note" style="min-height:36px">${SCOUT[grade(c.potGuess)]}</p>
    <button class="btn green" data-pick="${i}" style="width:100%">이 선수로 시작</button></div>`).join('')}</div>
  <div style="margin-top:12px"><button class="btn ghost" id="freroll">다른 선수 보기</button></div></div>`:''}
  <div class="card"><h2>명예의 전당</h2>${hofView()}</div>`;
  const sync=()=>{CF.name=document.getElementById('fname').value;CF.hs=document.getElementById('fhs').value;
    const nv=document.getElementById('fnum').value;CF.num=nv===''?CF.num:clamp(Math.round(+nv),0,99);};
  document.getElementById('fpos').onchange=e=>{sync();CF.pos=e.target.value;CANDS=null;renderCreate();};
  document.getElementById('fhand').onchange=e=>{sync();CF.hand=e.target.value;renderCreate();};
  document.querySelectorAll('[data-body]').forEach(b=>b.onclick=()=>{sync();CF.body=b.dataset.body;CANDS=null;renderCreate();});
  const gen=()=>{sync();CANDS=[0,1,2].map(()=>makeCandidate(CF.pos,CF.body));renderCreate();};
  document.getElementById('fgo').onclick=gen;
  if(document.getElementById('freroll'))document.getElementById('freroll').onclick=gen;
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{sync();if(!CF.name.trim()){toast('이름을 입력해 주세요');return;}startGame({...CF,name:CF.name.trim()},CANDS[+b.dataset.pick]);CANDS=null;});
}

/* ================= 시작 ================= */
S=load();
if(S&&!S.stats)S=null;
if(S&&S.v!==2){
  const fix=c=>{if(!c)return;if(c.cur==='KRW'&&c.sal<1000)c.sal=Math.round(c.sal*10000/100)*100;};
  fix(S.con);if(S.milInfo)fix(S.milInfo.con);
  if(S.lg==='NPB'&&S.con&&S.con.cur==='KRW'){S.con.cur='JPY';S.con.sal=Math.round(S.con.sal/FX.JPY/100)*100;}
  if(S.con&&S.con.cur==='USD'&&S.con.type==='reserve'&&S.con.sal<MLB_MIN)S.con.sal=MLB_MIN;
  if(S.con&&S.con.type==='reserve'&&S.con.cur==='KRW')S.con.sal=Math.max(kboMin(),S.con.sal);
  S.earned=S.earned||0;S.v=2;S.queue=[];save();
}
render();
</script>
</body>
</html>
